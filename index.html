:root {
  --ink: #17212b; --ink-2: #44505c; --ink-3: #66727f; --ink-4: #98a2ae;
  --canvas: #eceff2; --surface: #ffffff; --surface-2: #f5f7f9; --surface-3: #eaeef2;

  --btn-bg: #17212b; --btn-fg: #ffffff;
  --ok: #17794a; --ok-bg: #e2f3ea; --warn: #9a5b00; --warn-bg: #fdf0d6; --danger: #b42318; --danger-bg: #fde8e6; --info: #1d5fa8; --info-bg: #e3eef9;
  --side: #121a23; --side-ink: #aeb8c3; --side-on: #ffffff; --side-line: rgba(255, 255, 255, .08);
  --focus: #2f6fed; --shadow: 0 10px 30px rgba(15, 23, 32, .18), 0 2px 6px rgba(15, 23, 32, .1);
  --r1: 6px; --r2: 10px; --r3: 14px;
  --font-body: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-head: Bahnschrift, "DIN Alternate", "Franklin Gothic Medium", "Arial Narrow", var(--font-body);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --ink: #e7ecf1; --ink-2: #b6c0ca; --ink-3: #8c98a5; --ink-4: #5f6b78;
  --canvas: #0e141a; --surface: #161f28; --surface-2: #1b2631; --surface-3: #223040;
  --line: #263341; --line-2: #34445a;
  --brand: #ff5a70; --brand-ink: #ff8393; --brand-tint: #3a1a21;
  --btn-bg: #e7ecf1; --btn-fg: #101820;
  --ok: #4cc38a; --ok-bg: #12301f; --warn: #f0b24a; --warn-bg: #33270e; --danger: #ff7b70; --danger-bg: #3a1a18; --info: #6cb0f5; --info-bg: #14283d;
  --side: #0a1016; --side-ink: #8f9bab; --side-line: rgba(255, 255, 255, .07);
  --focus: #6aa0ff; --shadow: 0 10px 30px rgba(0, 0, 0, .55), 0 2px 6px rgba(0, 0, 0, .4);
  color-scheme: dark;
}
.sync-chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--surface-3); color: var(--ink-3); white-space: nowrap; }
.sync-chip.ok { background: var(--ok-bg); color: var(--ok); }

/* ---------- Kerangka ---------- */

.top .menu-btn { display: none; }
.search-trigger { display: flex; align-items: center; gap: 10px; min-width: 280px; height: 36px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface-2); color: var(--ink-3); text-align: left; }
.search-trigger:hover { border-color: var(--ink-4); }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 14px; margin-bottom: 20px; border-bottom: 2px solid var(--ink); }

#banner { display: flex; flex-direction: column; }
.banner { display: flex; align-items: center; gap: 12px; padding: 9px 22px; font-size: 13px; font-weight: 500; border-bottom: 1px solid var(--line); background: var(--warn-bg); color: var(--warn); }
.banner.danger { background: var(--danger-bg); color: var(--danger); } .banner.info { background: var(--info-bg); color: var(--info); }

/* ---------- Panel & kartu ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r2); min-width: 0; }
.panel-h { display: flex; align-items: center; gap: 10px; padding: 13px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r2); overflow: hidden; margin-bottom: 18px; }
.stat { padding: 16px 18px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; min-width: 0; }
.stat[data-act] { cursor: pointer; } .stat[data-act]:hover { background: var(--surface-2); }
.stat-top { display: flex; align-items: center; justify-content: space-between; color: var(--ink-3); font-size: 12.5px; font-weight: 600; }
.stat-ic { color: var(--ink-4); }

.empty { text-align: center; padding: 44px 20px; color: var(--ink-3); }
.empty h3 { font-size: 16px; color: var(--ink); margin-bottom: 4px; } .empty p { max-width: 46ch; margin: 0 auto 14px; }
.empty-ic { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 12px; background: var(--surface-3); color: var(--ink-3); }
.empty-sm { padding: 18px; text-align: center; color: var(--ink-3); background: var(--surface-2); border-radius: var(--r1); }

/* ---------- Tombol ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: var(--r1); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13.5px; text-decoration: none; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--surface-2); border-color: var(--ink-4); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--btn-bg); border-color: var(--btn-bg); color: var(--btn-fg); }
.btn.primary:hover { filter: brightness(1.18); background: var(--btn-bg); }
:root[data-theme="dark"] .btn.primary:hover { filter: brightness(.92); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--line-2)); }
.btn.danger:hover { background: var(--danger-bg); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; } .btn.danger.solid:hover { filter: brightness(1.1); background: var(--danger); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; } .btn.ok:hover { filter: brightness(1.1); background: var(--ok); }
.btn.ghost { border-color: transparent; background: transparent; } .btn.ghost:hover { background: var(--surface-3); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; gap: 6px; }
.btn.icon { width: 36px; padding: 0; } .btn.icon.sm { width: 30px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; pointer-events: none; }
.btn.block { width: 100%; }
.btn-group { display: inline-flex; } .btn-group .btn { border-radius: 0; margin-left: -1px; } .btn-group .btn:first-child { border-radius: var(--r1) 0 0 var(--r1); margin-left: 0; } .btn-group .btn:last-child { border-radius: 0 var(--r1) var(--r1) 0; }
.btn-group .btn.on { background: var(--ink); border-color: var(--ink); color: var(--surface); }

/* ---------- Form ---------- */
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld-l { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.fld-h { font-size: 12px; color: var(--ink-3); font-weight: 400; }
.req { color: var(--brand); font-style: normal; margin-left: 3px; }
.input, .select, .textarea { width: 100%; min-height: 38px; padding: 7px 11px; border: 1px solid var(--line-2); border-radius: var(--r1); background: var(--surface); color: var(--ink); transition: border-color .12s, box-shadow .12s; }
.textarea { resize: vertical; line-height: 1.45; min-height: 74px; }
.input:hover, .select:hover, .textarea:hover { border-color: var(--ink-4); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
.input[readonly] { background: var(--surface-2); color: var(--ink-2); }
.input.sm, .select.sm { min-height: 32px; padding: 4px 9px; font-size: 13px; }
.chk { display: flex; align-items: flex-start; gap: 9px; cursor: pointer; line-height: 1.35; }
.chk input { width: 17px; height: 17px; margin: 1px 0 0; accent-color: var(--ink); flex: none; }
.chk small { display: block; }
.form-grid { display: grid; gap: 14px 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); } .form-grid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .form-grid.c1 { grid-template-columns: minmax(0, 1fr); }
.form-grid .full { grid-column: 1 / -1; }
.form-sec { margin: 6px 0 -2px; padding-top: 14px; border-top: 1px dashed var(--line-2); font: 600 14px var(--font-head); color: var(--ink); }
.search { position: relative; } .search .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-4); pointer-events: none; } .search .input { padding-left: 34px; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--line-2); background: var(--surface); font-size: 13px; font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { border-color: var(--ink-4); } .chip.on { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip .n { font-size: 11.5px; opacity: .7; }

/* ---------- Badge, avatar, progres, tab ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface-3); color: var(--ink-2); }
.badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.warn { background: var(--warn-bg); color: var(--warn); } .badge.danger { background: var(--danger-bg); color: var(--danger); } .badge.info { background: var(--info-bg); color: var(--info); }
.badge.line { background: transparent; border: 1px solid var(--line-2); }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--ink); color: var(--surface); font: 600 13px var(--font-head); flex: none; overflow: hidden; }
.avatar.xs { width: 20px; height: 20px; font-size: 9.5px; } .avatar.lg { width: 48px; height: 48px; font-size: 17px; }
.uchip { display: inline-flex; align-items: center; gap: 7px; }
.progress { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.row > .progress { flex: 1; min-width: 56px; }
.progress i { display: block; height: 100%; background: var(--ink); border-radius: 3px; transition: width .3s; }
.progress.ok i { background: var(--ok); } .progress.warn i { background: var(--warn); } .progress.danger i { background: var(--danger); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; margin-bottom: 18px; scrollbar-width: none; }
.tab { padding: 10px 14px; border: 0; background: none; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--ink-3); font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
.tab:hover { color: var(--ink); } .tab.on { color: var(--ink); border-bottom-color: var(--brand); }
.tab-b { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--surface-3); color: var(--ink-2); font-size: 11px; display: grid; place-items: center; }
.tab-b.warn { background: var(--warn-bg); color: var(--warn); } .tab-b.danger { background: var(--danger-bg); color: var(--danger); }
.stamp { display: inline-block; padding: 3px 12px 2px; border: 2px solid currentColor; border-radius: 4px; font: 700 13px/1.3 var(--font-head); letter-spacing: .09em; text-transform: uppercase; transform: rotate(-2.2deg); opacity: .92; mix-blend-mode: multiply; }
:root[data-theme="dark"] .stamp { mix-blend-mode: normal; }
.stamp.ok { color: var(--ok); } .stamp.warn { color: var(--warn); } .stamp.danger { color: var(--danger); } .stamp.mute { color: var(--ink-3); }

/* ---------- Tabel ---------- */
.tbl-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.table th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--ink-3); padding: 10px 14px; border-bottom: 1px solid var(--line-2); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
.table th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; } .table th.sorted { color: var(--ink); }
.table td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr:hover td { background: var(--surface-2); } .table tr.clickable { cursor: pointer; }
.table .td-empty { text-align: center; color: var(--ink-3); padding: 28px; }
.table td.num, .table th.num { text-align: right; } .table td.c, .table th.c { text-align: center; }
.table .code { font-weight: 600; font-family: var(--font-head); letter-spacing: .01em; white-space: nowrap; }
.table.dense td { padding: 6px 10px; } .table.dense th { padding: 7px 10px; }
.table tr.row-danger td { background: color-mix(in srgb, var(--danger-bg) 55%, transparent); }
.pager { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-3); }
.pager > div { display: flex; align-items: center; gap: 8px; }

/* ---------- Modal, toast, menu ---------- */
.modal-back { position: fixed; inset: 0; z-index: 100; background: rgba(9, 14, 20, .58); display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadein .14s; }
.modal { background: var(--surface); border-radius: var(--r3); box-shadow: var(--shadow); max-height: calc(100vh - 40px); width: 100%; display: flex; flex-direction: column; animation: popin .16s; outline: none; border: 1px solid var(--line); }
.modal-sm { max-width: 440px; } .modal-md { max-width: 680px; } .modal-lg { max-width: 940px; } .modal-xl { max-width: 1240px; }

<script>
'use strict';
/* ---- 01-util.js ---- */
/* =====================================================================
   01-util.js — utilitas inti (tanpa akses DOM saat load)
   ===================================================================== */
const APP = Object.freeze({
  name: 'EzPickUp SOP System', version: '9.0.0', build: '2026-10-18',

/* ---------- HTML aman (auto-escape) ---------- */
class Raw { constructor(s) { this.s = s; } toString() { return this.s; } }
const raw = s => new Raw(s == null ? '' : String(s));
const ESCMAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']|[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]/g, c => ESCMAP[c] || '');

  : Array.isArray(v) ? v.map(toHtml).join('')
  : (v == null || v === false || v === true) ? '' : esc(v);
/* tagged template: semua interpolasi di-escape kecuali Raw */
const h = (s, ...v) => { let o = s[0]; for (let i = 0; i < v.length; i++) o += toHtml(v[i]) + s[i + 1]; return new Raw(o); };
const enc = encodeURIComponent;

/* ---------- DOM ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const byId = id => document.getElementById(id);
const debounce = (fn, ms = 250) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* ---------- Umum ---------- */
const clone = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));
const uid = (p = 'id') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const isNum = v => v !== '' && v !== null && v !== undefined && !isNaN(Number(v));
const sum = a => a.reduce((x, y) => x + y, 0);
const uniq = a => Array.from(new Set(a));
const initials = n => String(n || '?').trim().split(/\s+/).map(x => x[0]).join('').slice(0, 2).toUpperCase() || '?';
const trunc = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const fileSafe = s => String(s || 'dokumen').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, '_').replace(/-+/g, '-').slice(0, 90);
const cmpStr = (a, b) => String(a || '').localeCompare(String(b || ''), 'id', { numeric: true, sensitivity: 'base' });

function getPath(o, path) {
  const ks = String(path).split('.'); let c = o;
  for (const k of ks) { if (c == null) return undefined; c = c[k]; }
  return c;
}

  const ks = String(path).split('.'); let c = o;
  if (ks.some(k => k === '__proto__' || k === 'constructor' || k === 'prototype')) return;
  for (let i = 0; i < ks.length - 1; i++) {
    const k = ks[i]; if (c[k] == null) c[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; c = c[k];
  }
  c[ks[ks.length - 1]] = val;
}

/* ---------- Tanggal (selalu waktu LOKAL, bukan UTC) ---------- */
const pad = (n, l = 2) => String(n).padStart(l, '0');
const MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const MONTHS_S = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const DAYS = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => toISO(new Date());
const parseISO = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };

function parseRichBlocks(text) {

      const items = []; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*\d+[.)]\s+/, '')); i++; }
      blocks.push({ t: 'ol', items }); continue;

    if (ln.includes('|')) {

/* data contoh (ditandai sample:true, bisa dihapus sekali klik) */
function makeSampleKpi() {
  const base = { 'k-inb': 99.7, 'k-qc': 98.5, 'k-put': 96, 'k-pick': 99.85, 'k-pack': 99.92, 'k-otd': 98.4, 'k-inv': 99.6, 'k-ret': 94, 'k-doc': 100 };
  const wob = [-0.4, 0.15, -0.25, 0.2, -0.1, 0]; const months = ['2026-04', '2026-05', '2026-06', '2026-07', '2026-08', '2026-09'];
  const out = [];
  months.forEach((m, i) => {
    Object.keys(base).forEach((k, j) => {
      const swing = (k === 'k-put' || k === 'k-ret') ? 6 : 1; let v = base[k] + wob[(i + j) % 6] * swing * (i === 5 ? 0 : 1);
      v = Math.min(100, Math.round(v * 100) / 100); out.push({ kpi: k, period: m, value: v, sample: true });
    });
    out.push({ kpi: 'k-cmp', period: m, value: [0.6, 0.5, 0.45, 0.5, 0.35, 0.3][i], sample: true });
  });
  return out;
}

/* ---------- KPI ---------- */
function kpiAch(def, v) {
  v = Number(v); if (!isFinite(v)) return NaN; const t = Number(def.target);
  if (def.dir === 'down') { if (v <= t) return 100; return t > 0 ? clamp(t / v * 100, 0, 100) : 0; }
  return t > 0 ? clamp(v / t * 100, 0, 100) : 100;
}
function kpiStatus(def, v) {
  const a = kpiAch(def, v); if (!isFinite(a)) return { k: 'none', label: 'Belum ada data', a };
  const w = DB.settings.kpiWarn || 95;
  return a >= 100 ? { k: 'ok', label: 'Tercapai', a } : a >= w ? { k: 'warn', label: 'Mendekati', a } : { k: 'danger', label: 'Di bawah target', a };
}
const kpiSeries = id => DB.kpiData.filter(d => d.kpi === id).sort((a, b) => cmpStr(a.period, b.period));

/* ---------- Penomoran surat ---------- */
function numFormat(fmt, p) {
  const d = parseISO(p.date) || new Date(), n = DB.settings.numbering || DEFAULT_SETTINGS.numbering;
  return String(fmt || n.format).replace(/\{(NNN|N|KODE|BLN|BL|THN|TH)\}/g, (m, k) => ({
    NNN: pad(p.seq, n.pad || 3), N: String(p.seq), KODE: p.kode, BLN: ROMAN[d.getMonth()], BL: pad(d.getMonth() + 1), THN: String(d.getFullYear()), TH: String(d.getFullYear()).slice(-2)
  }[k]));
}
function counterKey(typeId, dateISO) {
  const n = DB.settings.numbering || DEFAULT_SETTINGS.numbering, d = parseISO(dateISO) || new Date();
  const scope = n.scope === 'all' ? '*' : typeId;
  const per = n.reset === 'month' ? `${d.getFullYear()}-${pad(d.getMonth() + 1)}` : n.reset === 'never' ? 'all' : String(d.getFullYear());
  return `${scope}|${per}`;
}
function lastSeq(key) {
  let m = DB.counters[key] || 0;
  DB.letters.forEach(l => { if (l.key === key && l.seq > m) m = l.seq; });
  return m;
}
function peekNumber(typeId, dateISO) {
  const t = letterType(typeId) || { prefix: typeId }, key = counterKey(typeId, dateISO);
  let seq = lastSeq(key) + 1, no = numFormat(null, { seq, kode: t.prefix, date: dateISO });
  while (DB.letters.some(l => l.no === no)) { seq++; no = numFormat(null, { seq, kode: t.prefix, date: dateISO }); }
  return { no, seq, key };
}
function commitNumber(typeId, dateISO) {
  const p = peekNumber(typeId, dateISO); DB.counters[p.key] = p.seq; dbSave('counters'); return p;
}

/* ---------- Kelengkapan SOP (lint) ---------- */
function sopLint(c, code, opts) {
  opts = opts || {}; const out = []; const add = (level, tab, msg) => out.push({ level, tab, msg });
  const secs = resolveSections(c), has = id => secs.some(x => x.id === id);   // bagian yang disembunyikan tidak diperiksa
  if (!c.title) add('error', 'info', 'Judul SOP belum diisi.');
  if (!code) add('error', 'info', 'Kode dokumen belum diisi.');
  else if (opts.checkUnique && DB.sops.some(s => s.code === code && s.id !== opts.id)) add('error', 'info', `Kode ${code} sudah dipakai SOP lain.`);
  if (!c.owner) add('warn', 'info', 'Pemilik proses (owner) belum diisi.');
  if (!c.isoClause) add('warn', 'info', 'Klausul ISO 9001 belum dipetakan.');
  if (has('tujuan') && !c.tujuan) add('error', 'tujuan', 'Tujuan belum diisi.');
  if (has('scope') && !c.scope) add('error', 'tujuan', 'Ruang lingkup belum diisi.');
  if (has('definisi') && !c.definisi.filter(r => r[0]).length) add('warn', 'ref', 'Definisi/istilah belum ada.');
  if (has('referensi') && !c.referensi.length) add('warn', 'ref', 'Dokumen referensi belum ada.');
  if (has('resp') && !c.resp.filter(r => r[0]).length) add('error', 'resp', 'Tanggung jawab (RACI ringkas) belum diisi.');
  if (has('proc')) {
    const steps = c.proc.filter(r => r[1]);
    if (!steps.length) add('error', 'proc', 'Prosedur belum memiliki langkah.');
    else {
      const noPic = steps.filter(r => !r[2]).length; if (noPic) add('warn', 'proc', `${noPic} langkah belum punya PIC.`);
      const noTime = steps.filter(r => !r[3]).length; if (noTime) add('warn', 'proc', `${noTime} langkah belum punya batas waktu.`);
    }
  }
  if (has('flow')) {
    if (c.flow.length < 2) add('error', 'flow', 'Flowchart minimal memiliki awal dan akhir.');
    else {
      if (c.flow[0].t !== 'start') add('warn', 'flow', 'Flowchart sebaiknya diawali simbol "Mulai".');
      if (c.flow[c.flow.length - 1].t !== 'end') add('warn', 'flow', 'Flowchart sebaiknya diakhiri simbol "Selesai".');
      c.flow.forEach((n, i) => {
        if (!n.l) add('error', 'flow', `Simpul ${i + 1} flowchart belum berisi teks.`);
        if (n.t === 'decision' && !n.no) add('warn', 'flow', `Keputusan "${trunc(n.l, 30)}" belum punya cabang "Tidak".`);
        if (n.t === 'decision' && n.back != null && n.back >= c.flow.length) add('error', 'flow', `Cabang keputusan "${trunc(n.l, 30)}" mengarah ke simpul yang tidak ada.`);
      });
    }
  }
  if (has('sla') && !c.sla) add('warn', 'lamp', 'SLA / batas waktu keseluruhan belum diisi.');
  if (has('risiko') && !c.risiko.filter(r => r[0]).length) add('warn', 'risk', 'Risiko & pengendalian belum diisi (ISO 9001 klausul 6.1).');
  if (has('forms')) c.forms.forEach(f => { if (!formByCode(f)) add('warn', 'risk', `Formulir ${f} tidak ada di Pustaka Formulir.`); });
  if (has('kpi')) c.kpi.forEach(k => { if (!kpiDef(k)) add('warn', 'risk', `KPI ${k} tidak ditemukan.`); });
  secs.filter(x => !x.builtin && x.req).forEach(x => { if (!secHasValue(c, x)) add('error', 'extra', `Isian "${x.title}" belum diisi.`); });
  return out;
}
const lintScore = lint => Math.max(0, 100 - lint.filter(x => x.level === 'error').length * 15 - lint.filter(x => x.level === 'warn').length * 5);

/* =====================================================================
   03b-diff.js — pembanding revisi SOP (LCS per baris + per kata)
   ===================================================================== */
function diffSeq(A, B, eq) {
  eq = eq || ((x, y) => x === y);
  const n = A.length, m = B.length; let s = 0;
  while (s < n && s < m && eq(A[s], B[s])) s++;
  let e = 0; while (e < n - s && e < m - s && eq(A[n - 1 - e], B[m - 1 - e])) e++;
  const a = A.slice(s, n - e), b = B.slice(s, m - e), N = a.length, M = b.length;
  const ops = []; for (let i = 0; i < s; i++) ops.push({ t: '=', v: A[i] });
  if (N * M > 4e6) { a.forEach(v => ops.push({ t: '-', v })); b.forEach(v => ops.push({ t: '+', v })); }
  else {
    const dp = Array.from({ length: N + 1 }, () => new Uint32Array(M + 1));
    for (let i = N - 1; i >= 0; i--) for (let j = M - 1; j >= 0; j--) dp[i][j] = eq(a[i], b[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    let i = 0, j = 0;
    while (i < N && j < M) {
      if (eq(a[i], b[j])) { ops.push({ t: '=', v: a[i] }); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ t: '-', v: a[i] }); i++; }
      else { ops.push({ t: '+', v: b[j] }); j++; }
    }
    while (i < N) ops.push({ t: '-', v: a[i++] }); while (j < M) ops.push({ t: '+', v: b[j++] });
  }
  for (let k = n - e; k < n; k++) ops.push({ t: '=', v: A[k] });
  return ops;
}

/* representasi teks per bagian SOP */
const flowLine = (n, i) => {
  const lab = { start: 'Mulai', process: 'Proses', decision: 'Keputusan', end: 'Selesai' }[n.t] || n.t;
  return `${i + 1}. [${lab}] ${n.l}` + (n.t === 'decision' ? ` ⇒ Tidak: ${n.no || '—'}${n.back != null ? ` ↩ simpul ${n.back + 1}` : ''}` : '');
};
function sopSections(c) {

  const secs = normSecs(c.secs), hidden = secs.hide.filter(id => SEC_DEFS[id] && id !== 'riwayat').map(id => (SEC_DEFS[id] || {}).title);
  const base = [
    { key: 'info', label: 'Informasi dokumen', lines: [`Judul: ${c.title}`, `Kategori: ${catLabel(c.cat)}`, `Departemen: ${c.dept}`, `Pemilik proses: ${c.owner}`, `Klausul ISO: ${c.isoClause}`, `Deskripsi: ${c.desc}`].concat(hidden.length ? [`Bagian disembunyikan: ${hidden.join(', ')}`] : []) },
    { key: 'tujuan', label: 'Tujuan', lines: ln(c.tujuan) },
    { key: 'scope', label: 'Ruang lingkup', lines: ln(c.scope) },
    { key: 'definisi', label: 'Definisi', lines: c.definisi.map(r => `${r[0]} — ${r[1]}`) },
    { key: 'referensi', label: 'Referensi', lines: c.referensi.slice() },
    { key: 'resp', label: 'Tanggung jawab', lines: c.resp.map(r => `${r[0]} — ${r[1]}`) },
    { key: 'proc', label: 'Prosedur', lines: c.proc.map((r, i) => `${i + 1}. ${r[1]}  [PIC: ${r[2] || '—'}; Waktu: ${r[3] || '—'}]`) },
    { key: 'flow', label: 'Flowchart', lines: c.flow.map(flowLine) },
    { key: 'sla', label: 'SLA', lines: ln(c.sla) },
    { key: 'kpi', label: 'KPI terkait', lines: c.kpi.map(id => { const k = kpiDef(id); return k ? `${k.name} (target ${k.target}${k.unit})` : id; }) },
    { key: 'risiko', label: 'Risiko & pengendalian', lines: c.risiko.map(r => `${r[0]} ⇒ ${r[1]}`) },
    { key: 'forms', label: 'Formulir & rekaman', lines: c.forms.map(f => { const fm = formByCode(f); return `${f}${fm ? ' — ' + fm.name : ''}${c.retensi[f] ? ' (retensi ' + c.retensi[f] + ')' : ''}`; }) },
    { key: 'lampiran', label: 'Lampiran', lines: ln(c.lampiran) }

  resolveSections(c).filter(x => !x.builtin).forEach(x => {
    const v = secValue(c, x);
    base.push({ key: 'x:' + x.id, label: x.title, lines: x.kind === 'text' ? ln(v) : x.kind === 'table' ? v.map(r => r.join(' — ')) : x.kind === 'olist' ? v.map((t, i) => `${i + 1}. ${t}`) : v.slice() });

}
function diffSop(oldC, newC) {
  const A = sopSections(oldC), B = sopSections(newC), keys = [];
  A.concat(B).forEach(x => { if (!keys.includes(x.key)) keys.push(x.key); });
  return keys.map(k => {
    const a = A.find(x => x.key === k), b = B.find(x => x.key === k), ops = diffSeq(a ? a.lines : [], b ? b.lines : []);
    return { key: k, label: (b || a).label, ops, changed: ops.some(o => o.t !== '=') };

}
function wordDiffHTML(a, b) {
  const tok = s => String(s).split(/(\s+)/).filter(x => x !== '');
  const ops = diffSeq(tok(a), tok(b));

  ops.forEach(o => {
    if (o.t === '=') { del += esc(o.v); ins += esc(o.v); }
    else if (o.t === '-') del += `<del class="w">${esc(o.v)}</del>`;

/* HTML hasil perbandingan; hanya bagian yang berubah (kecuali all=true) */
function diffHTML(sections, all) {
  const changed = sections.filter(s => s.changed);
  if (!changed.length && !all) return h`<div class="empty-sm">Tidak ada perbedaan isi antara kedua versi.</div>`;
  const out = (all ? sections : changed).map(sec => {
    const rows = []; const ops = sec.ops;
    for (let i = 0; i < ops.length; i++) {
      const o = ops[i];
      if (o.t === '-' && ops[i + 1] && ops[i + 1].t === '+') {
        const [d, n] = wordDiffHTML(o.v, ops[i + 1].v);
        rows.push(`<div class="df-line del">${d}</div><div class="df-line add">${n}</div>`); i++;
      } else if (o.t === '-') rows.push(`<div class="df-line del">${esc(o.v)}</div>`);
      else if (o.t === '+') rows.push(`<div class="df-line add">${esc(o.v)}</div>`);
      else if (all || sec.changed) rows.push(`<div class="df-line same">${esc(o.v)}</div>`);
    }
    const adds = ops.filter(o => o.t === '+').length, dels = ops.filter(o => o.t === '-').length;
    const bd = (n, k, sg) => n ? `<span class="badge ${k}">${sg}${n}</span>` : '';
    return `<section class="df-sec"><header><b>${esc(sec.label)}</b>${bd(adds, 'ok', '+')}${bd(dels, 'danger', '−')}</header>${rows.join('')}</section>`;
  }).join('');

}

/* bentuk kanonik (kunci terurut) agar pembandingan tidak terkecoh urutan kunci jsonb */
const canon = v => JSON.stringify(v, (k, x) => (x && typeof x === 'object' && !Array.isArray(x)) ? Object.keys(x).sort().reduce((o, key) => { o[key] = x[key]; return o; }, {}) : x);

function collRows(name, value) {
  const c = COLLS[name], out = new Map();
  if (c.kind === 'list') {
    arr(value).forEach((r, i) => {
      if (!isObjR(r)) return; const id = String(c.id(r) == null ? '' : c.id(r));
      if (!id || id.indexOf('undefined') >= 0) return;
      out.set(id, { id, data: r, pos: c.pos ? i : 0 });
    });
  } else if (c.kind === 'map') {
    Object.keys(value || {}).forEach(k => { if (Array.isArray(value[k])) out.set(k, { id: k, data: value[k], pos: 0 }); });
  } else if (c.kind === 'kv') {
    Object.keys(value || {}).forEach(k => out.set(k, { id: k, data: { n: Math.max(0, Math.floor(Number(value[k]) || 0)) }, pos: 0 }));
  } else {
    const o = Object.assign({}, value || {}); (c.local || []).forEach(k => { delete o[k]; });
    out.set(c.id, { id: c.id, data: o, pos: 0 });
  }

    return l.map(r => r.data);
  }
  if (c.kind === 'map') { const o = {}; rows.forEach(r => { o[r.id] = r.data; }); return o; }
  if (c.kind === 'kv') { const o = {}; rows.forEach(r => { o[r.id] = Number(r.data && r.data.n) || 0; }); return o; }
  const r = rows.find(x => x.id === c.id);
  const v = r && isObjR(r.data) ? r.data : clone(DB_KEYS[name]);
  if (c.local) Object.assign(v, Store.read('local_settings', {}));
  return v;
}

    getItem: k => { const l = L(), s = S(); return (l && l.getItem(k)) || (s && s.getItem(k)) || null; },
    setItem: (k, v) => { const l = L(), s = S(); if (l && l.getItem('ezp9_persist') === '1') { l.setItem(k, v); if (s) s.removeItem(k); } else if (s) { s.setItem(k, v); if (l) l.removeItem(k); } },
    removeItem: k => { const l = L(), s = S(); if (l) l.removeItem(k); if (s) s.removeItem(k); }
  };
})();

function dbReset() {
  Object.keys(DB_KEYS).forEach(k => { DB[k] = clone(DB_KEYS[k]); });
  DB.settings = Object.assign(clone(DEFAULT_SETTINGS), Store.read('local_settings', {}));
  DB.docConfig = clone(DEFAULT_DOC_CONFIG);
}

const Cloud = {
  sb: null, snap: {}, revs: {}, dirty: new Set(), repull: new Set(), quiet: false, started: false,
  status: 'idle', lastError: '', channel: null, timer: null, retryT: null, retryN: 0, inflight: null, _chain: Promise.resolve(), lastPull: 0,
  configured() { return !!(CLOUD_CFG.url && CLOUD_CFG.anonKey && window.supabase && window.supabase.createClient); },
  init() {
    if (this.sb) return true;
    if (!this.configured()) return false;
    // Batasi request jaringan supaya login/restore tidak menggantung tanpa batas.
    // Gunakan AbortController agar pekerjaan jaringan juga benar-benar dibatalkan saat timeout.
    const boundedFetch = (input, options = {}) => {
      const ctl = new AbortController();
      const upstream = options.signal;
      const abort = () => ctl.abort();
      if (upstream) {
        if (upstream.aborted) ctl.abort();
        else upstream.addEventListener('abort', abort, { once: true });
      }
      const timer = setTimeout(() => ctl.abort(), 20000);
      return fetch(input, { ...options, signal: ctl.signal }).finally(() => {
        clearTimeout(timer);
        if (upstream) upstream.removeEventListener('abort', abort);
      });
    };
    this.sb = window.supabase.createClient(CLOUD_CFG.url, CLOUD_CFG.anonKey, {
      global: { fetch: boundedFetch },
      auth: { storage: authStorage, storageKey: 'ezp10-auth', persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
      realtime: { params: { eventsPerSecond: 10 } }
    });
    this.sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && Auth.user && !Auth.leaving) setTimeout(() => { if (Auth.user && !Auth.leaving) Auth.forceOut('Sesi Anda sudah berakhir. Silakan masuk lagi.'); }, 0); });
    return true;
  },
  pendingCount() { return this.dirty.size + (this.running ? 1 : 0) + (this.timer ? 1 : 0); },

  /* ---------- status & indikator ---------- */
  setStatus(s) {
    this.status = s;
    const el = typeof byId === 'function' ? byId('syncChip') : null;
    if (el) { el.className = 'sync-chip ' + s; el.textContent = this.label(); el.title = this.title(); }
    if (typeof renderBanner === 'function' && Auth.user) renderBanner();
  },
  label() { return ({ ok: 'Tersinkron', saving: 'Menyimpan…', offline: 'Offline', error: 'Gagal sinkron', idle: '' })[this.status] || ''; },
  title() {
    return this.status === 'offline' ? 'Tidak ada koneksi. Perubahan disimpan sementara di halaman ini dan dikirim otomatis saat tersambung — jangan tutup halaman.'
      : this.status === 'error' ? ('Gagal menyimpan ke server: ' + this.lastError) : this.status === 'saving' ? 'Mengirim perubahan ke server…' : 'Semua perubahan sudah tersimpan di server.';
  },

  /* ---------- membaca dari server ---------- */
  async fetchTable(t) {
    const colls = TABLE_COLLS[t], lim = Math.max(0, ...colls.map(k => COLLS[k].limit || 0));
    const q = () => this.sb.from(t).select('id,data,pos,rev');
    if (lim) { const { data, error } = await q().order('updated_at', { ascending: false }).limit(lim); if (error) throw error; return data || []; }
    const out = [], page = 1000;
    for (let from = 0; ; from += page) {
      const { data, error } = await q().order('id').range(from, from + page - 1);
      if (error) throw error;
      out.push(...(data || [])); if (!data || data.length < page) break;
    }
    return out;
  },
  setColl(name, rows) {
    const c = COLLS[name], mine = c.kind === 'cfg' ? rows.filter(r => r.id === c.id) : rows;
    DB[name] = collFromRows(name, mine);
    this.revs[name] = new Map(mine.map(r => [r.id, r.rev]));
  },
  rebase(names) {
    names.forEach(name => {
      const rows = collRows(name, DB[name]), revs = this.revs[name] || new Map(), m = new Map();
      rows.forEach((r, id) => { if (revs.has(id)) m.set(id, { sig: rowSig(r), rev: revs.get(id) }); });
      this.snap[name] = m;
    });
  },
  normalizeLoaded() {
    this.quiet = true;
    try { repairDb(); } finally { this.quiet = false; }
  },
  async loadProfiles() {
    const { data, error } = await this.sb.from('ezp_profiles').select('*').order('created_at');
    if (error) throw error;
    DB.users = (data || []).map(p => ({
      id: p.id, username: p.username, name: p.name, role: p.role, initials: p.initials || initials(p.name), disabled: !!p.disabled,
      mustChange: !!p.must_change, created: Date.parse(p.created_at) || 0, lastLogin: p.last_login ? Date.parse(p.last_login) : 0, pwChanged: p.pw_changed ? Date.parse(p.pw_changed) : 0
    }));
  },
  async myProfile() {
    const { data: s } = await this.sb.auth.getSession(); const uid = s && s.session && s.session.user && s.session.user.id;
    if (!uid) return null;
    const { data, error } = await this.sb.from('ezp_profiles').select('*').eq('id', uid).maybeSingle();
    if (error) throw error;
    return data || null;
  },
  async pullAll() {
    try {
      const tables = Object.keys(TABLE_COLLS);
      const res = await Promise.all(tables.map(t => this.fetchTable(t)));
      tables.forEach((t, i) => TABLE_COLLS[t].forEach(name => this.setColl(name, res[i])));
      await this.loadProfiles();
      this.normalizeLoaded();
      this.rebase(Object.keys(COLLS));
      this.lastPull = Date.now();
      return { ok: true };
    } catch (e) { console.error(e); return { ok: false, error: cloudMsg(e), e }; }
  },
  async refreshTable(t) {
    const rows = await this.fetchTable(t), names = TABLE_COLLS[t].filter(n => !this.dirty.has(n));
    names.forEach(n => this.setColl(n, rows));
    this.quiet = true; try { repairDb(); } finally { this.quiet = false; }
    this.rebase(names);
    TABLE_COLLS[t].filter(n => this.dirty.has(n)).forEach(() => this.repull.add(t));
  },
  async resync() {
    if (!this.started || this.pendingCount() || !Auth.user) return;
    const r = await this.pullAll(); if (r.ok) this.uiRefresh(false);
  },
  async start() {
    const r = await this.pullAll(); if (!r.ok) return r;
    this.startRealtime(); this.started = true; this.retryN = 0; this.setStatus('ok');
    return { ok: true, empty: !(DB.meta && DB.meta.schema) };
  },
  stop() {
    try { if (this.channel) this.sb.removeChannel(this.channel); } catch (e) { /* abaikan */ }
    this.channel = null; this.started = false; this.snap = {}; this.revs = {}; this.dirty.clear(); this.repull.clear();
    clearTimeout(this.timer); clearTimeout(this.retryT); this.timer = null; this.retryT = null; this.inflight = null; this.status = 'idle';
    dbReset();
  },

  /* ---------- mengirim ke server ---------- */
  mark(keys) {
    keys.forEach(k => {
      if (k === 'settings') { try { const o = {}; LOCAL_SETTINGS.forEach(f => { if (DB.settings[f] !== undefined) o[f] = DB.settings[f]; }); Store.write('local_settings', o); } catch (e) { /* abaikan */ } }
      if (COLLS[k]) this.dirty.add(k);
    });
    if (this.dirty.size && this.started) this.schedule();
  },
  schedule() { clearTimeout(this.timer); this.timer = setTimeout(() => { this.drain().catch(() => { }); }, 250); },
  drain() {
    clearTimeout(this.timer); this.timer = null;
    const run = this._chain.then(() => this._run());
    this._chain = run.catch(() => { });
    this.inflight = run; return run;
  },
  flushNow() { return (this.timer || this.dirty.size) ? this.drain() : (this.inflight || Promise.resolve({ ok: true, by: {} })); },
  async _run() {
    const ORD = Object.keys(COLLS), names = Array.from(this.dirty).sort((a, b) => ORD.indexOf(a) - ORD.indexOf(b)); this.dirty.clear();   // SOP dikirim sebelum riwayatnya
    const res = { ok: true, by: {} };
    if (!names.length || !this.started) return res;
    this.running = true; this.setStatus('saving');
    try {
      for (const name of names) {
        if (name === 'hist' && ['denied', 'conflict', 'unique'].includes(res.by.sops)) { res.by[name] = 'skipped'; res.ok = false; this.repull.add(COLLS[name].t); continue; }   // riwayat bergantung pada SOP-nya
        try { await this.pushColl(name); res.by[name] = 'ok'; }
        catch (e) { res.ok = false; await this.onPushError(name, e, res); }
      }
      await this.runRepull();
    } finally { this.running = false; }
    if (!this.dirty.size && res.ok) { this.retryN = 0; this.setStatus('ok'); }
    return res;
  },
  async pushColl(name) {
    const c = COLLS[name], snap = this.snap[name] || (this.snap[name] = new Map());
    const rows = collRows(name, DB[name]), ups = [], dels = [];
    rows.forEach((r, id) => { const sig = rowSig(r), s = snap.get(id); if (!s) ups.push({ r, sig, rev: 1 }); else if (s.sig !== sig) ups.push({ r, sig, rev: s.rev + 1 }); });
    if (!(c.append || c.kind === 'cfg' || c.kind === 'kv')) snap.forEach((s, id) => { if (!rows.has(id)) dels.push(id); });
    /* record baru → INSERT berkelompok; record lama → UPDATE per record (upsert tidak dipakai karena RLS
       memeriksa kebijakan INSERT juga pada jalur "update", sehingga staff tak bisa mengajukan revisi) */
    const news = ups.filter(u => !snap.has(u.r.id)), olds = ups.filter(u => snap.has(u.r.id));
    let batch = [], bytes = 0; const batches = [];
    news.forEach(u => { const n = canon(u.r.data).length; if (batch.length && (batch.length >= 50 || bytes + n > 900000)) { batches.push(batch); batch = []; bytes = 0; } batch.push(u); bytes += n; });
    if (batch.length) batches.push(batch);
    for (const b of batches) {
      const payload = b.map(u => stripNul({ id: u.r.id, data: u.r.data, pos: u.r.pos, rev: u.rev }));
      const { error } = await this.sb.from(c.t).insert(payload);
      if (error) throw error;
      b.forEach(u => snap.set(u.r.id, { sig: u.sig, rev: u.rev }));
    }
    const one = async u => {
      const { data, error } = await this.sb.from(c.t).update(stripNul({ data: u.r.data, pos: u.r.pos, rev: u.rev })).eq('id', u.r.id).eq('rev', u.rev - 1).select('id,rev');
      if (error) throw error;
      if (!data || !data.length) {
        const chk = await this.sb.from(c.t).select('id,rev').eq('id', u.r.id).maybeSingle(); if (chk.error) throw chk.error;
        const conflict = !chk.data || Number(chk.data.rev) !== u.rev - 1;
        const e = new Error(conflict ? 'Data berubah atau dihapus pengguna lain.' : 'Tidak berwenang mengubah data ini.'); e.code = conflict ? 'PT409' : '42501'; throw e;
      }
      snap.set(u.r.id, { sig: u.sig, rev: u.rev });
    };
    for (let i = 0; i < olds.length; i += 8) {
      const rs = await Promise.allSettled(olds.slice(i, i + 8).map(one));
      const bad = rs.find(x => x.status === 'rejected'); if (bad) throw bad.reason;
    }
    for (let i = 0; i < dels.length; i += 50) {
      const part = dels.slice(i, i + 50);
      const { data, error } = await this.sb.from(c.t).delete().in('id', part).select('id');
      if (error) throw error;
      const gone = new Set((data || []).map(x => x.id)); part.forEach(id => { if (gone.has(id)) snap.delete(id); });
      if (gone.size < part.length) {
        const left = part.filter(id => !gone.has(id));
        const chk = await this.sb.from(c.t).select('id').in('id', left); if (chk.error) throw chk.error;
        const still = new Set((chk.data || []).map(x => x.id));
        left.forEach(id => { if (!still.has(id)) snap.delete(id); });
        if (still.size) { const e = new Error('Tidak berwenang menghapus data.'); e.code = '42501'; throw e; }
      }
    }
  },
  async onPushError(name, e, res) {
    const code = String((e && e.code) || ''), st = Number((e && (e.status || e.statusCode)) || 0), t = COLLS[name].t;
    if (isNetErr(e)) { res.by[name] = 'offline'; this.dirty.add(name); this.lastError = cloudMsg(e); this.setStatus('offline'); this.scheduleRetry(); return; }
    if (code === 'PT409') { res.by[name] = 'conflict'; this.repull.add(t); toast('Data diubah pengguna lain pada saat yang sama. Versi terbaru dimuat — ulangi perubahan Anda.', 'warn', 8000); return; }
    if (code === '23505') { res.by[name] = 'unique'; this.repull.add(t); toast(uniqueMsg(name), 'danger', 8000); return; }
    if (code === '42501' || st === 403) { res.by[name] = 'denied'; this.repull.add(t); toast('Anda tidak berwenang menyimpan perubahan ini. Data dikembalikan ke versi server.', 'danger', 8000); return; }
    if (st === 401 || /jwt|not authenticated/i.test(String((e && e.message) || ''))) { res.by[name] = 'auth'; this.dirty.add(name); Auth.forceOut('Sesi Anda berakhir. Silakan masuk lagi.'); return; }
    res.by[name] = 'error'; this.dirty.add(name); this.lastError = cloudMsg(e); console.error('Sinkron gagal', name, e);
    this.setStatus('error'); this.scheduleRetry();
  },
  scheduleRetry() {
    clearTimeout(this.retryT); const wait = Math.min(60000, 3000 * Math.pow(2, this.retryN++));
    this.retryT = setTimeout(() => { if (this.dirty.size && this.started) this.drain().catch(() => { }); }, wait);
  },
  async runRepull() {
    const ts = Array.from(this.repull); this.repull.clear();
    for (const t of ts) { try { await this.refreshTable(t); } catch (e) { this.repull.add(t); console.error(e); } }
    if (ts.length) this.uiRefresh(false);
  },

  /* ---------- realtime ---------- */
  startRealtime() {
    if (this.channel) return;
    const ch = this.sb.channel('ezp-sync');
    Object.keys(TABLE_COLLS).concat(['ezp_profiles']).forEach(t => ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, p => { try { this.onChange(t, p); } catch (e) { console.error(e); } }));
    ch.subscribe(st => { if (st === 'SUBSCRIBED') { if (this._rtDown) { this._rtDown = false; this.resync(); } } else if (st === 'CLOSED' || st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') this._rtDown = true; });
    this.channel = ch;
  },
  onChange(t, p) {
    if (!Auth.user) return;
    if (t === 'ezp_profiles') { clearTimeout(this._pt); this._pt = setTimeout(() => this.onProfilesChanged(), 400); return; }
    const row = p.eventType === 'DELETE' ? p.old : p.new; if (!row || !row.id) return;
    COLL_OF_TABLE_ROW(t, row.id).forEach(name => {
      const c = COLLS[name], snap = this.snap[name] || (this.snap[name] = new Map()), s = snap.get(row.id);
      if (p.eventType !== 'DELETE' && s && s.rev >= row.rev) return;                 // gema dari tulisan sendiri
      if (this.dirty.has(name) || this.running) { this.repull.add(t); return; }       // ada perubahan lokal belum terkirim: gabung nanti
      if (c.pos) { this.repullSoon(t); return; }
      if (p.eventType === 'DELETE') { this.removeLocal(name, row.id); snap.delete(row.id); }
      else {
        const r = { id: row.id, data: row.data, pos: row.pos || 0 };
        this.applyLocal(name, r); snap.set(row.id, { sig: rowSig(r), rev: row.rev });
      }
      this.touchUi(name);
    });
  },
  applyLocal(name, r) {
    const c = COLLS[name];
    if (c.kind === 'list') {
      const l = DB[name], i = l.findIndex(x => String(c.id(x)) === r.id);
      if (i >= 0) l[i] = r.data; else l.push(r.data);
      if (c.sort) l.sort(c.sort);
    } else if (c.kind === 'map') DB[name][r.id] = r.data;
    else if (c.kind === 'kv') DB[name][r.id] = Number(r.data && r.data.n) || 0;
    else { const v = isObjR(r.data) ? r.data : {}; if (c.local) Object.assign(v, Store.read('local_settings', {})); DB[name] = v; }
  },
  removeLocal(name, id) {
    const c = COLLS[name];
    if (c.kind === 'list') DB[name] = DB[name].filter(x => String(c.id(x)) !== id);
    else if (c.kind === 'map' || c.kind === 'kv') delete DB[name][id];
  },
  repullSoon(t) { clearTimeout(this['_rp_' + t]); this['_rp_' + t] = setTimeout(() => { if (this.dirty.size || this.running) { this.repull.add(t); return; } this.refreshTable(t).then(() => this.uiRefresh(true)).catch(console.error); }, 600); },
  touchUi(name) {
    if (name === 'counters' || name === 'meta') return;
    if (name === 'notifs' || name === 'activity') { if (typeof renderTop === 'function') renderTop(); const p = App.cur && App.cur.path; if (p === '/activity' || p === '/dashboard') this.uiRefresh(false); return; }
    this.uiRefresh(true);
  },
  uiRefresh(info) {
    clearTimeout(this._ui);
    this._ui = setTimeout(() => {
      if (!Auth.user) return;
      if (typeof MODALS !== 'undefined' && MODALS.length) return;
      if (App.dirty && App.dirty()) return;
      App.rerender(); if (info && Date.now() - (this._lastToast || 0) > 6000) { this._lastToast = Date.now(); toast('Data diperbarui oleh pengguna lain.', 'info', 2500); }
    }, 500);
  },
  async onProfilesChanged() {
    try { await this.loadProfiles(); } catch (e) { return; }
    const me = Auth.user; if (!me) return;
    const u = DB.users.find(x => x.username === me.username);
    if (!u || u.disabled) return Auth.forceOut('Akun Anda dinonaktifkan atau dihapus oleh administrator.');
    if (u.role !== me.role || u.name !== me.name) { Auth.user = Auth.pub(u); if (typeof renderSide === 'function') { renderSide(); renderTop(); } App.rerender(); }
    else if (App.cur && App.cur.path === '/users') this.uiRefresh(false);
  },

  /* ---------- penomoran atomik di server ---------- */
  async claim(key, min) { return (await this.claimBlock(key, min, 1)); },
  async claimBlock(key, min, n) {
    const { data, error } = await this.sb.rpc('ezp_claim_seq_block', { p_key: key, p_min: Math.max(1, Math.floor(min)), p_count: Math.max(1, Math.floor(n)) });
    if (error) throw error; return Number(data);
  },

  /* ---------- inisialisasi server kosong (hanya administrator) ---------- */
  legacyLocal() {
    try {
      const m = Store.read('meta', null), s = Store.read('sops', null);
      if (m && m.schema && Array.isArray(s) && s.length) return { sops: s.length, letters: arr(Store.read('letters', [])).length };
    } catch (e) { /* abaikan */ }
    return null;
  },
  async initServer() {
    const lg = this.legacyLocal(); let from = 'seed';
    if (lg) {
      const ok = await confirmBox({ title: 'Impor data lama dari browser ini?', text: `Server masih kosong, tetapi browser ini menyimpan data versi lama (${lg.sops} SOP, ${lg.letters} surat). Impor ke server agar bisa dipakai bersama? Pilih "Mulai baru" untuk memakai data contoh bawaan. Akun lama tidak ikut diimpor — buat akun lewat menu Pengguna.`, ok: 'Impor ke server', cancel: 'Mulai baru' });
      if (ok) from = 'local';
    }
    this.quiet = true;
    try {
      if (from === 'local') {
        Object.keys(DB_KEYS).forEach(k => { if (k !== 'users') DB[k] = Store.read(k, clone(DB_KEYS[k])); });
        repairDb();
        DB.meta = Object.assign({}, DB.meta, { schema: 8, importedAt: Date.now(), from: 'browser' });
      } else seedFresh();
      DB.meta = Object.assign({}, DB.meta, { schema: 8 });
    } finally { this.quiet = false; }
    this.snap = {}; this.revs = {};
    this.mark(Object.keys(COLLS).filter(k => k !== 'activity' && k !== 'notifs'));
    const r = await this.flushNow();
    return r;
  }
};

/* ---- 04-auth.js ---- */
/* =====================================================================
   04-auth.js — pengguna, peran (RBAC), login, kunci akun, sesi
   Catatan: ini kontrol akses di sisi klien (browser). Cukup untuk mencegah
   akses tak sengaja, bukan pengganti keamanan server.
   ===================================================================== */
const ROLES = { admin: 'Superadmin', supervisor: 'Supervisor', staff: 'Staff', viewer: 'Viewer (baca saja)' };
const ROLE_DESC = {
  admin: 'Superadmin: pengaturan akun, reset kata sandi pengguna, konfigurasi, backup, dan seluruh modul.',
  supervisor: 'Membuat & menyetujui revisi SOP, mengelola KPI, audit, formulir, surat.',
  staff: 'Mengusulkan revisi SOP, membuat surat, mengisi KPI.',
  viewer: 'Hanya melihat dan mencetak dokumen.'
};
const CAPS = {
  'sop.view': 'admin supervisor staff viewer', 'sop.propose': 'admin supervisor staff', 'sop.approve': 'admin supervisor', 'sop.create': 'admin supervisor',
  'sop.delete': 'admin', 'sop.export': 'admin supervisor staff viewer',
  'letter.create': 'admin supervisor staff', 'letter.void': 'admin supervisor', 'letter.template': 'admin',
  'form.manage': 'admin supervisor', 'kpi.input': 'admin supervisor staff', 'kpi.manage': 'admin supervisor',
  'audit.manage': 'admin supervisor', 'config.manage': 'admin', 'user.manage': 'admin',
  'data.backup': 'admin supervisor', 'data.restore': 'admin', 'activity.view': 'admin supervisor'
};
const can = cap => { const r = Auth.user && Auth.user.role; return !!r && (CAPS[cap] || '').split(' ').includes(r); };

const COMMON_PW = new Set(['admin123', 'password', 'password1', '12345678', '123456789', 'qwerty123', 'sup123', 'staff123', 'ezpickup', 'ezpickup123']);
function pwPolicy(pw, username) {
  pw = String(pw || '');
  if (pw.length < 8) return 'Kata sandi minimal 8 karakter.';
  if (!/[A-Za-z]/.test(pw) || !/\d/.test(pw)) return 'Kata sandi harus mengandung huruf dan angka.';
  if (username && pw.toLowerCase().includes(String(username).toLowerCase()) && String(username).length >= 4) return 'Kata sandi tidak boleh memuat nama pengguna.';
  if (COMMON_PW.has(pw.toLowerCase())) return 'Kata sandi terlalu mudah ditebak.';
  return '';
}

const authErr = e => {
  const m = String((e && e.message) || ''), st = Number((e && e.status) || 0);
  if (isNetErr(e)) return 'Tidak dapat terhubung ke server. Periksa koneksi internet.';
  if (st === 429 || /rate limit|too many/i.test(m)) return 'Terlalu banyak percobaan. Tunggu beberapa menit lalu coba lagi.';

  if (/weak|at least|should be/i.test(m)) return 'Kata sandi tidak memenuhi syarat keamanan server.';

const Auth = {

  addUser({ username, name, role, password }) {
    username = String(username || '').trim().toLowerCase(); name = String(name || '').trim();

    if (!name) return Promise.resolve('Nama lengkap wajib diisi.');

    if (u.role === 'admin' && !u.disabled && admins.length === 1 && ((role !== undefined && role !== 'admin') || disabled === true)) return Promise.resolve('Harus tersisa minimal satu administrator aktif.');
    if (this.user && this.user.username === username && disabled === true) return Promise.resolve('Anda tidak bisa menonaktifkan akun yang sedang dipakai.');
    if (this.user && this.user.username === username && role !== undefined && role !== u.role) return Promise.resolve('Anda tidak bisa mengubah peran akun yang sedang dipakai. Minta administrator lain melakukannya.');

  },
  deleteUser(username) {
    const u = DB.users.find(x => x.username === username); if (!u) return Promise.resolve('Pengguna tidak ditemukan.');
    if (this.user && this.user.username === username) return Promise.resolve('Anda tidak bisa menghapus akun yang sedang dipakai.');
    if (u.role === 'admin' && DB.users.filter(x => x.role === 'admin' && !x.disabled).length === 1) return Promise.resolve('Harus tersisa minimal satu administrator aktif.');
    return this.admin('delete', { username });
  }
};

    const c = cols.find(x => x.k === st.sort);
    if (c) data.sort((a, b) => { const va = c.val ? c.val(a) : a[c.k], vb = c.val ? c.val(b) : b[c.k]; return ((typeof va === 'number' && typeof vb === 'number') ? va - vb : cmpStr(va, vb)) * st.dir; });
  }
  const pages = Math.max(1, Math.ceil(data.length / pageSize)); st.page = clamp(st.page, 1, pages);

  const th = cols.map(c => c.sort === false || (!c.k && !c.val) ? h`<th class="${c.cls || ''}" style="${c.w ? 'width:' + c.w : ''}">${c.label}</th>` : h`<th class="sortable ${c.cls || ''} ${st.sort === c.k ? 'sorted' : ''}" style="${c.w ? 'width:' + c.w : ''}" aria-sort="${st.sort === c.k ? (st.dir > 0 ? 'ascending' : 'descending') : 'none'}"><button type="button" data-act="tbl.sort" data-t="${id}" data-k="${c.k}">${c.label}${st.sort === c.k ? ico(st.dir > 0 ? 'up' : 'down', 12) : ''}</button></th>`);
  const body = slice.length ? slice.map(r => h`<tr${raw(rowAct ? ` data-act="${rowAct}" class="clickable"` : '')}${raw(rowData ? attrs(rowData(r)) : '')}>${cols.map(c => h`<td class="${c.cls || ''}" data-l="${typeof c.label === 'string' ? c.label : ''}">${c.render ? c.render(r) : (r[c.k] == null ? '' : r[c.k])}</td>`)}</tr>`) : h`<tr><td colspan="${cols.length}" class="td-empty">${empty}</td></tr>`;
  const pager = pages > 1 ? h`<div class="pager"><span>${(st.page - 1) * pageSize + 1}–${Math.min(st.page * pageSize, data.length)} dari ${data.length}</span><div>${btn('', 'tbl.page', { icon: 'left', cls: 'sm', data: { t: id, p: st.page - 1 }, attrs: { disabled: st.page <= 1, 'aria-label': 'Sebelumnya' } })}<b>${st.page}/${pages}</b>${btn('', 'tbl.page', { icon: 'right', cls: 'sm', data: { t: id, p: st.page + 1 }, attrs: { disabled: st.page >= pages, 'aria-label': 'Berikutnya' } })}</div></div>` : '';

   ===================================================================== */
const stColor = k => ({ ok: 'var(--ok)', warn: '#d99a1d', danger: 'var(--danger)', none: 'var(--ink-4)' }[k] || 'var(--ink-3)');
function sparkline(vals, o = {}) {
  const w = o.w || 92, hgt = o.h || 28, pd = 3, v = vals.map(Number).filter(isFinite);
  if (v.length < 2) return raw(`<span class="muted tiny">—</span>`);
  const tg = isFinite(o.target) ? o.target : null;
  const all = tg == null ? v : v.concat([tg]), mn = Math.min(...all), mx = Math.max(...all), rg = (mx - mn) || 1;
  const x = i => pd + i * (w - 2 * pd) / (v.length - 1), y = n => hgt - pd - (n - mn) / rg * (hgt - 2 * pd);
  const pts = v.map((n, i) => `${x(i).toFixed(1)},${y(n).toFixed(1)}`).join(' ');
  const last = v[v.length - 1];
  return raw(`<svg class="spark" width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}" role="img" aria-label="Tren ${v.length} periode">${tg != null ? `<line x1="${pd}" x2="${w - pd}" y1="${y(tg).toFixed(1)}" y2="${y(tg).toFixed(1)}" stroke="var(--ink-4)" stroke-dasharray="3 3" stroke-width="1"/>` : ''}<polyline points="${pts}" fill="none" stroke="var(--ink-2)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(v.length - 1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="2.8" fill="${o.color || 'var(--ink)'}"/></svg>`);
}
/* grafik garis: o = {labels, series:[{name, values, color}], target, unit, w, h, dec} */
function lineChart(o) {
  const W = o.w || 640, H = o.h || 260, m = { l: 46, r: 24, t: 14, b: 34 }, n = o.labels.length;
  const vals = o.series.flatMap(s => s.values).map(Number).filter(isFinite).concat(isFinite(o.target) ? [Number(o.target)] : []);
  if (!n || !vals.length) return h`<div class="empty-sm">Belum ada data untuk digambar.</div>`;
  let mn = Math.min(...vals), mx = Math.max(...vals); const pad = (mx - mn) * .15 || Math.abs(mx) * .05 || 1; mn -= pad; mx += pad;
  if (o.floor0 && mn < 0) mn = 0;
  const x = i => m.l + (n === 1 ? (W - m.l - m.r) / 2 : i * (W - m.l - m.r) / (n - 1)), y = v => m.t + (1 - (v - mn) / (mx - mn)) * (H - m.t - m.b);
  const ticks = 5, grid = Array.from({ length: ticks }, (_, i) => mn + (mx - mn) * i / (ticks - 1));
  const dec = o.dec == null ? ((mx - mn) < 5 ? 1 : 0) : o.dec;
  let s = `<svg class="lchart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.title || 'Grafik tren')}">`;
  grid.forEach(g => { s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(g).toFixed(1)}" y2="${y(g).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l - 8}" y="${(y(g) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--ink-3)">${fmtNum(g, dec)}</text>`; });
  const step = Math.ceil(n / 8);
  o.labels.forEach((l, i) => { if (i % step === 0 || i === n - 1) s += `<text x="${x(i).toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${esc(l)}</text>`; });
  if (isFinite(o.target)) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(o.target).toFixed(1)}" y2="${y(o.target).toFixed(1)}" stroke="var(--brand)" stroke-width="1.4" stroke-dasharray="6 4"/><text x="${W - m.r}" y="${(y(o.target) - 5).toFixed(1)}" text-anchor="end" font-size="11" font-weight="600" fill="var(--brand)">Target ${fmtNum(o.target, dec)}${esc(o.unit || '')}</text>`;
  o.series.forEach((se, si) => {
    const col = se.color || 'var(--ink)'; const pts = se.values.map((v, i) => isFinite(+v) && v !== null && v !== '' ? [x(i), y(+v), v, i] : null);
    const path = pts.filter(Boolean).map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    s += `<path d="${path}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.filter(Boolean).forEach(p => { s += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--surface)" stroke="${col}" stroke-width="2"><title>${esc(se.name || '')} ${esc(o.labels[p[3]])}: ${fmtNum(p[2], dec)}${esc(o.unit || '')}</title></circle>`; });
  });
  return raw(s + '</svg>');
}

/* ---------- Peringatan (turunan data, tidak disimpan) ---------- */
function computeAlerts() {
  const out = [], today = todayISO(), add = (level, title, text, to) => out.push({ level, title, text, to });
  if (can('sop.approve')) DB.sops.filter(s => s.pending).forEach(s => add('warn', 'Revisi menunggu persetujuan', `${s.code} · diajukan ${s.pending.by || '—'} ${timeAgo(s.pending.at)}`, '/approval'));
  DB.sops.forEach(s => { const d = sopDue(s); if (d && d.level === 'danger') add('danger', 'Tinjauan SOP terlambat', `${s.code} · ${d.text}`, `/sop/${enc(s.code)}`); else if (d && d.level === 'warn') add('warn', 'Tinjauan SOP segera jatuh tempo', `${s.code} · ${d.text}`, `/sop/${enc(s.code)}`); });
  DB.audits.filter(a => a.status !== 'Selesai' && a.due).forEach(a => { const d = diffDays(today, a.due); if (d < 0) add('danger', 'Tindakan korektif terlambat', `${a.id} · terlambat ${-d} hari`, `/audit/${enc(a.id)}`); else if (d <= 7) add('warn', 'Tindakan korektif segera jatuh tempo', `${a.id} · ${d} hari lagi`, `/audit/${enc(a.id)}`); });
  if (can('audit.manage')) DB.audits.filter(a => a.status === 'Verifikasi').forEach(a => add('warn', 'Temuan menunggu verifikasi', `${a.id} · ${trunc(a.finding, 60)}`, `/audit/${enc(a.id)}`));
  DB.incoming.filter(r => r.status !== 'Selesai' && r.due && r.due < today).forEach(r => add('danger', 'Surat masuk lewat batas tindak lanjut', `${r.agenda} · ${trunc(r.subject, 50)} · terlambat ${-diffDays(today, r.due)} hari`, '/register?tab=masuk'));
  DB.kpiDefs.forEach(k => { const l = kpiLatest(k.id); if (!l || l.sample) return; const st = kpiStatus(k, l.value); if (st.k === 'danger') add('warn', 'KPI di bawah target', `${k.name}: ${fmtNum(l.value)}${k.unit} (target ${fmtNum(k.target)}${k.unit}) · ${fmtMonth(l.period)}`, '/kpi'); });
  if (can('kpi.input') && +today.slice(8) >= 5) {
    const pm = prevMonthKey(curMonthKey()), miss = DB.kpiDefs.filter(k => !DB.kpiData.some(d => d.kpi === k.id && d.period === pm));
    if (miss.length && DB.kpiData.some(d => !d.sample)) add('info', 'KPI bulan lalu belum diisi', `${miss.length} indikator belum punya data ${fmtMonth(pm)}`, '/kpi');
  }
  const order = { danger: 0, warn: 1, info: 2, ok: 3 };
  return out.sort((a, b) => order[a.level] - order[b.level]);
}

/* =====================================================================

const FLOW = { W: 620, CX: 190, NW: 250, TW: 210, GAP: 30, LH: 15, PX: 12, BX: 372, BW: 198 };

function flowSVG(nodes, o = {}) {

  const uidn = 'fa' + (++_flowUid), items = [];

  };

      it.w = dw; it.lines = lines; it.h = Math.max(78, lines.length * F.LH + 46);
      const noLines = flowWrap(n.no || 'Tentukan tindak lanjut', F.BW - 20, false), backIn = n.back != null && n.back >= from && n.back <= to && n.back !== i;
      let extra = []; if (n.back != null && !backIn && nodes[n.back] && n.back !== i) extra = flowWrap('↺ kembali ke: ' + trunc(nodes[n.back].l, 46), F.BW - 20, false);

      const items = b.items || []; let from = 0;
      while (from < items.length) {
        const avail = rem(); let lo = 0, hi = items.length - from;
        const mk = k => blockHTML(Object.assign({}, b, { items: items.slice(from, from + k), start: (b.start || 1) + from }));
        while (lo < hi) { const mid = Math.ceil((lo + hi) / 2); if (meas(mk(mid)) <= avail) lo = mid; else hi = mid - 1; }
        if (lo === 0) { if (cur.blocks.length) { newPage(); continue; } lo = 1; }
        const html = mk(lo); place(html, meas(html)); from += lo; if (from < items.length) newPage();
      }
    };
    const splitPara = b => {
      const toks = richTokens(b.text); let from = 0;
      const mkP = (a, z) => { const o = Object.assign({}, b); const html = blockHTML(Object.assign(o, { text: '' })); return html.replace(/(<div class="d-p"[^>]*>)<\/div>/, `$1${tokensHTML(toks.slice(a, z))}</div>`); };
      const lh = parseFloat(getComputedStyle(host).lineHeight) || 20;
      while (from < toks.length) {
        const avail = rem(); let lo = from, hi = toks.length;
        while (lo < hi) { const mid = Math.ceil((lo + hi) / 2); if (meas(mkP(from, mid)) <= avail) lo = mid; else hi = mid - 1; }
        let k = lo;
        if (k >= toks.length) { const html = mkP(from, toks.length); place(html, meas(html)); break; }
        /* kendali yatim/janda: minimal 2 baris di tiap sisi */
        const linesOf = (a, z) => Math.round((meas(mkP(a, z)) - 0) / lh);
        let guard = 0;
        while (k > from && linesOf(k, toks.length) < 2 && guard++ < 40) k -= Math.max(1, Math.floor((k - from) / 12));

      if (b.keepNext && b.t !== 'h' && b.t !== 'table' && hpx <= rem() + .5 && cur.blocks.length) { newPage(); place(html, hpx); continue; }
      if (b.t === 'table') { if (b.nobreak || isSmallTable(b)) { if (cur.blocks.length) newPage(); place(html, hpx); } else { if (b.keepNext && cur.blocks.length && minSlice(b) > rem()) newPage(); splitTable(b); } continue; }
      if (b.t === 'ul' || b.t === 'ol') { splitList(b); continue; }
      if (b.t === 'p' && !b.nobreak) { splitPara(b); continue; }
      if (b.t === 'kv') { splitTable({ t: 'table', cols: b.cols || [28, 72], align: ['l', 'l'], rows: (b.rows || []).map(r => [{ c: r[0], bold: true }, r[1]]), noBorder: b.noBorder, size: b.size }); continue; }
      /* tidak bisa dipecah → halaman baru */
      if (cur.blocks.length) { newPage(); if (b.keepPrev && hpx <= rem()) pullLast(); }
      place(html, hpx);
    }

    while (pages.length > 1 && !pages[pages.length - 1].blocks.length) pages.pop();

      const hd = (pg.first ? hdrFirst : hdrRest) ? (pg.first ? hdrFirst : hdrRest)(i + 1, N, pg.first) : { html: '' };
      const ft = pg.first && spec.footerFirst !== undefined ? (spec.footerFirst ? spec.footerFirst(1, N) : '') : (spec.footer ? spec.footer(i + 1, N) : '');
      const top = topOf(pg.H) / PXMM, bot = botOf(pg.F) / PXMM, hx = hd.w ? ` style="left:${((Wmm - hd.w) / 2).toFixed(2)}mm;right:${((Wmm - hd.w) / 2).toFixed(2)}mm"` : '';
      return `<div class="pg ${spec.kind || 'sop'}${land ? ' land' : ''}" data-wm="${esc(wm)}" data-p="${i + 1}" style="${esc(fontCss)}--ml:${m.l}mm;--mr:${m.r}mm;--mt:${hd.bleed ? 0 : m.t}mm;--mb:${m.b}mm;--mf:${(m.f == null ? m.b : m.f)}mm;--bt:${top.toFixed(2)}mm;--bb:${bot.toFixed(2)}mm"><div class="pg-hdr${hd.bleed ? ' bleed' : ''}"${hx}>${hd.html}</div><div class="pg-body">${pg.blocks.map(x => x.html).join('')}</div><div class="pg-ftr">${ft}</div></div>`;

}

    else if (sec.kind === 'olist') { if (v.length) out.push({ t: 'ol', items: v }); }
    else if (sec.kind === 'table' && v.length) { const cols = sec.cols || ['Kolom 1', 'Kolom 2']; tbl(equalCols(cols.length), cols.map(() => 'l'), cols, v.map(r => r.map((c, i) => i === 0 && cols.length > 1 ? { c, bold: true } : c))); }

    case 'referensi': if (s.referensi.length) out.push({ t: 'ul', items: s.referensi }); break;
    case 'definisi': { const d = s.definisi.filter(r => r[0] || r[1]); if (d.length) tbl([28, 72], ['l', 'l'], ['Istilah', 'Definisi'], d.map(r => [{ c: r[0], bold: true }, r[1]])); break; }
    case 'resp': { const d = s.resp.filter(r => r[0] || r[1]); if (d.length) tbl([30, 70], ['l', 'l'], ['Jabatan / Peran', 'Tanggung Jawab'], d.map(r => [{ c: r[0], bold: true }, r[1]])); break; }
    case 'proc': { const d = s.proc.filter(r => r[1]); if (d.length) tbl([6, 56, 18, 20], ['c', 'l', 'l', 'l'], ['No', 'Aktivitas', 'PIC', 'Waktu / Standar'], d.map((r, i) => [String(i + 1), r[1], r[2], r[3]])); break; }
    case 'flow': if (s.flow.filter(x => x.l).length >= 2) out.push({ t: 'flow', nodes: s.flow }); break;
    case 'kpi': { const kp = s.kpi.map(id => kpiDef(id)).filter(Boolean); if (kp.length) tbl([40, 20, 18, 22], ['l', 'c', 'c', 'l'], ['Indikator', 'Target', 'Frekuensi', 'Pemilik'], kp.map(k => [{ c: k.name, bold: true }, `${k.dir === 'down' ? '≤ ' : '≥ '}${fmtNum(k.target)}${k.unit}`, k.freq || '', k.owner || ''])); break; }

/* ---- 30-sop-core.js ---- */
/* =====================================================================
   30-sop-core.js — logika siklus hidup SOP: draf → ajukan → setujui/tolak
   → terbit (revisi), nonaktif, duplikat, hapus, riwayat
   ===================================================================== */
const sopCodeOk = c => /^[A-Za-z0-9][A-Za-z0-9\/._-]{2,40}$/.test(String(c || '').trim());
const sopUrl = (code, tab) => `/sop/${enc(code)}${tab ? '?tab=' + tab : ''}`;
const routeCode = m => { try { return decodeURIComponent(m); } catch (e) { return m; } };
const nowBy = () => ({ by: Auth.user ? Auth.user.name : 'Sistem', byUser: Auth.user ? Auth.user.username : '' });

/* konten kerja untuk editor: draf revisi bila ada, kalau tidak isi terbit */
const sopWorking = s => (s.draft && s.draft.content) ? clone(s.draft.content) : contentOf(s);
function sopCanEdit(s) {
  if (!s || s.status === 'obsolete' || s.pending) return false;
  return s.status === 'draft' ? can('sop.create') : can('sop.propose');
}
function sopCanApprove(s) {
  if (!s || !s.pending || !can('sop.approve')) return false;
  const me = Auth.user, own = s.pending.byUser && s.pending.byUser === me.username;
  return !own || (me.role === 'admin' && DB.settings.allowSelfApprove !== false);
}
function applyContent(s, c) { SOP_CONTENT.forEach(k => { s[k] = clone(c[k]); }); }
const sameContent = (a, b) => JSON.stringify(normContent(a)) === JSON.stringify(normContent(b));

/* simpan hasil edit. Mengembalikan pesan galat atau '' */
function sopSave(s, content, note) {
  content = normContent(content);
  const me = nowBy();
  if (s.status === 'draft') { applyContent(s, content); s.updatedAt = Date.now(); s.updatedBy = me.by; }
  else {
    if (sameContent(content, contentOf(s))) s.draft = null;
    else s.draft = { content, ...me, at: Date.now(), base: s.rev, note: note || (s.draft && s.draft.note) || '', bump: s.draft ? s.draft.bump !== false : true };
  }
  return dbSave('sops') ? '' : 'Penyimpanan penuh — gagal menyimpan.';
}
function sopCreate(code, content) {
  code = String(code || '').trim();
  if (!sopCodeOk(code)) return { err: 'Kode dokumen 3–41 karakter (huruf, angka, / . _ -).' };
  if (DB.sops.some(x => x.code.toLowerCase() === code.toLowerCase())) return { err: `Kode ${code} sudah dipakai.` };
  const me = nowBy(), c = normContent(content);
  const s = normSop(Object.assign({ code, status: 'draft', rev: '00', createdBy: me.by, updatedBy: me.by }, c));
  s.effectiveDate = ''; s.nextReview = '';
  DB.sops.push(s); DB.hist[code] = [];
  if (!dbSave('sops', 'hist')) return { err: 'Penyimpanan penuh — SOP belum tersimpan.' };
  logAct('Buat SOP', code, c.title);
  return { sop: s };
}
/* ajukan: draf → menunggu persetujuan (atau langsung terbit bila kebijakan memperbolehkan) */
function sopSubmit(s, note, bump) {
  const lint = sopLint(sopWorking(s), s.code); const errs = lint.filter(x => x.level === 'error');
  if (errs.length) return `Belum bisa diajukan: ${errs[0].msg}${errs.length > 1 ? ` (+${errs.length - 1} masalah lain)` : ''}`;
  const me = nowBy();
  if (s.status === 'draft') s.pending = { content: contentOf(s), ...me, at: Date.now(), base: null, note: note || 'Penerbitan awal', bump: false };
  else {
    if (!s.draft) return 'Tidak ada perubahan untuk diajukan.';
    if (!String(note || s.draft.note || '').trim()) return 'Isi uraian perubahan terlebih dahulu.';
    s.draft.note = note || s.draft.note; s.draft.bump = bump !== false; s.draft.at = Date.now(); Object.assign(s.draft, me); delete s.draft.status; delete s.draft.reason;
    s.pending = s.draft; s.draft = null;
  }
  if (s.status === 'draft') s.status = 'review';
  s.updatedAt = Date.now();
  dbSave('sops'); logAct('Ajukan revisi SOP', s.code, s.pending.note);
  if (DB.settings.requireApproval === false && sopCanApprove(s)) return sopApprove(s, { date: todayISO(), note: s.pending.note }) || '';
  notify('warn', 'Revisi SOP menunggu persetujuan', `${s.code} · ${s.title} diajukan ${me.by}`, '/approval', 'cap:sop.approve');
  return '';
}
function sopApprove(s, o) {
  const slot = s.pending; o = o || {};
  if (!slot) return 'Tidak ada revisi yang menunggu persetujuan.';
  const me = Auth.user, isNew = slot.base == null;
  const date = validISO(o.date) ? o.date : todayISO();
  applyContent(s, slot.content);
  if (!isNew && o.bump !== false && slot.bump !== false) s.rev = nextRevStr(s.rev);
  s.status = 'aktif'; s.effectiveDate = date; s.nextReview = addMonthsISO(date, DB.settings.reviewMonths || 12);
  s.approvedBy = me ? me.name : ''; s.approvedAt = Date.now(); s.updatedAt = Date.now(); s.updatedBy = slot.by;
  (DB.hist[s.code] = DB.hist[s.code] || []).push({ rev: s.rev, date, ts: Date.now(), by: slot.by, approvedBy: s.approvedBy, note: o.note || slot.note || (isNew ? 'Penerbitan awal' : 'Revisi'), snap: contentOf(s) });
  s.pending = null; s.draft = null;
  if (!dbSave('sops', 'hist')) return 'Penyimpanan penuh — keputusan belum tersimpan.';
  logAct(isNew ? 'Terbitkan SOP' : 'Setujui revisi SOP', s.code, `Rev. ${s.rev}${o.note ? ' · ' + o.note : ''}`);
  if (slot.byUser) notify('ok', 'Revisi SOP disetujui', `${s.code} terbit sebagai Rev. ${s.rev}`, sopUrl(s.code), 'user:' + slot.byUser);
  return '';
}
function sopReject(s, reason) {
  const slot = s.pending; if (!slot) return 'Tidak ada revisi yang menunggu.';
  if (!String(reason || '').trim()) return 'Alasan penolakan wajib diisi agar pengusul tahu apa yang perlu diperbaiki.';
  s.draft = Object.assign({}, slot, { status: 'ditolak', reason: String(reason).trim() }); s.pending = null;
  if (s.status === 'review') s.status = 'draft';
  s.updatedAt = Date.now();
  dbSave('sops'); logAct('Tolak revisi SOP', s.code, reason);
  if (slot.byUser) notify('danger', 'Revisi SOP ditolak', `${s.code}: ${trunc(reason, 90)}`, sopUrl(s.code), 'user:' + slot.byUser);
  return '';
}
function sopWithdraw(s) {
  const slot = s.pending; if (!slot) return;
  if (s.status === 'review') { s.status = 'draft'; } else s.draft = Object.assign({}, slot, { status: undefined, reason: undefined });
  s.pending = null; s.updatedAt = Date.now(); dbSave('sops'); logAct('Tarik pengajuan SOP', s.code, '');
}
function sopSetObsolete(s, on) {
  s.status = on ? 'obsolete' : 'aktif'; s.pending = on ? null : s.pending; s.updatedAt = Date.now();
  if (!on && !validISO(s.nextReview)) s.nextReview = addMonthsISO(todayISO(), DB.settings.reviewMonths || 12);
  dbSave('sops'); logAct(on ? 'Nonaktifkan SOP' : 'Aktifkan kembali SOP', s.code, '');
}
function sopDelete(s) {
  DB.sops = DB.sops.filter(x => x.id !== s.id); delete DB.hist[s.code];
  DB.kpiDefs.forEach(k => { if (k.sop === s.code) k.sop = ''; });
  const ok = dbSave('sops', 'hist', 'kpiDefs'); logAct('Hapus SOP', s.code, s.title); return ok;
}
function sopDuplicate(s, code) {
  const r = sopCreate(code, contentOf(s)); if (r.err) return r;
  r.sop.title = s.title + ' (salinan)'; dbSave('sops'); return r;
}
/* keterkaitan: SOP yang menyebut kode ini di referensi / formulir yang dipakai */
const sopBackRefs = code => DB.sops.filter(x => x.code !== code && (x.referensi || []).some(r => r.includes(code)));
const sopStateText = s => s.pending ? 'Menunggu persetujuan' : s.draft ? (s.draft.status === 'ditolak' ? 'Draf revisi ditolak' : 'Ada draf revisi') : STATUS_LABEL[s.status];

function tableView(b) {
