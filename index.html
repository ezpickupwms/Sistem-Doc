function richView(text) {
  const bl = parseRichBlocks(text); if (!bl.length) return h`<p class="muted">—</p>`;
  return h`<div class="rich">${bl.map(b => b.t === 'p' ? h`<p>${raw(richHTML(b.text))}</p>` : b.t === 'ul' ? h`<ul>${b.items.map(i => h`<li>${raw(richHTML(i))}</li>`)}</ul>` : b.t === 'ol' ? h`<ol>${b.items.map(i => h`<li>${raw(richHTML(i))}</li>`)}</ol>` : b.t === 'h' ? h`<h4>${b.text}</h4>` : b.t === 'table' ? tableView(b) : '')}</div>`;
}
function sopView(c) {
  const S = []; let n = 0;
  const sec = (id, title, inner) => { n++; S.push({ id, title, n, html: h`<section class="panel sop-sec" id="sec-${id}"><div class="panel-h"><h2><span class="sec-n">${n}</span>${title}</h2></div><div class="panel-b">${inner}</div></section>` }); };
  const has = t => String(t || '').trim() !== '';
  resolveSections(c).forEach(x => {
    if (!x.builtin) {                                         // isian tambahan (kustom)
      const v = secValue(c, x); if (!secHasValue(c, x)) return;
      if (x.kind === 'text') sec(x.id, x.title, richView(v));
      else if (x.kind === 'list') sec(x.id, x.title, h`<ul class="rich-ul">${v.map(t => h`<li>${raw(richHTML(t))}</li>`)}</ul>`);
      else if (x.kind === 'olist') sec(x.id, x.title, h`<ol class="rich-ul">${v.map(t => h`<li>${raw(richHTML(t))}</li>`)}</ol>`);
      else if (x.kind === 'table') sec(x.id, x.title, tableView({ head: [x.cols], rows: v.map(r => r.map((t, i) => i === 0 && x.cols.length > 1 ? `**${t}**` : t)) }));
      return;
    }
    switch (x.id) {
      case 'tujuan': case 'scope': case 'sla': case 'lampiran': if (has(c[x.field])) sec(x.id, x.title, richView(c[x.field])); break;
      case 'definisi': { const d = c.definisi.filter(r => r[0] || r[1]); if (d.length) sec('definisi', x.title, tableView({ head: [['Istilah', 'Definisi']], rows: d.map(r => [`**${r[0]}**`, r[1]]) })); break; }
      case 'referensi': if (c.referensi.length) sec('referensi', x.title, h`<ul class="rich-ul">${c.referensi.map(r => { const t = DB.sops.find(z => r.includes(z.code)); return h`<li>${t ? h`${r.replace(t.code, '')}<a href="#${sopUrl(t.code)}"><b>${t.code}</b></a>` : r}</li>`; })}</ul>`); break;
      case 'resp': { const d = c.resp.filter(r => r[0] || r[1]); if (d.length) sec('resp', x.title, tableView({ head: [['Jabatan / peran', 'Tanggung jawab']], rows: d.map(r => [`**${r[0]}**`, r[1]]) })); break; }
      case 'proc': { const d = c.proc.filter(r => r[1]); if (d.length) sec('proc', x.title, tableView({ head: [['No', 'Aktivitas', 'PIC', 'Waktu / standar']], rows: d.map((r, i) => [String(i + 1), r[1], r[2], r[3]]) })); break; }
      case 'flow': if (c.flow.filter(z => z.l).length >= 2) { const f = flowFull(c.flow); sec('flow', x.title, h`<div class="flow-view">${raw(f.svg)}</div>`); } break;
      case 'kpi': { const kp = c.kpi.map(id => kpiDef(id)).filter(Boolean); if (kp.length) sec('kpi', x.title, h`<div class="tbl-wrap"><table class="table dense"><thead><tr><th>Indikator</th><th>Target</th><th>Frekuensi</th><th>Pemilik</th><th>Terakhir</th></tr></thead><tbody>${kp.map(k => { const l = kpiLatest(k.id), st = l ? kpiStatus(k, l.value) : null; return h`<tr><td><a href="#/kpi?id=${enc(k.id)}"><b>${k.name}</b></a></td><td>${k.dir === 'down' ? '≤ ' : '≥ '}${fmtNum(k.target)}${k.unit}</td><td>${k.freq || ''}</td><td>${k.owner || ''}</td><td>${l ? h`${fmtNum(l.value)}${k.unit} ${l.sample ? badge('contoh', 'warn') : badge(st.label, st.k === 'ok' ? 'ok' : st.k === 'warn' ? 'warn' : 'danger')}` : '—'}</td></tr>`; })}</tbody></table></div>`); break; }
      case 'risiko': { const d = c.risiko.filter(r => r[0] || r[1]); if (d.length) sec('risiko', x.title, tableView({ head: [['Risiko', 'Pengendalian']], rows: d.map(r => [r[0], r[1]]) })); break; }
      case 'forms': if (c.forms.length) sec('forms', x.title, h`<div class="tbl-wrap"><table class="table dense"><thead><tr><th>Kode</th><th>Nama formulir</th><th>Retensi</th></tr></thead><tbody>${c.forms.map(code => { const f = formByCode(code); return h`<tr><td class="code">${f ? h`<a href="#/forms/${enc(code)}">${code}</a>` : code}</td><td>${f ? f.name : h`<span class="muted">tidak ada di pustaka</span>`}</td><td>${(c.retensi && c.retensi[code]) || '—'}</td></tr>`; })}</tbody></table></div>`); break;
      default: break;                                          // "riwayat" punya tab sendiri
    }
  });
  return S;
}

/* ---------- daftar SOP ---------- */
INP['sop.q'] = el => { UI.set('sop.q', el.value); tbl('sop').page = 1; App.rerender(); };
ACT['sop.cat'] = el => { UI.set('sop.cat', el.dataset.v); tbl('sop').page = 1; App.rerender(); };
ACT['sop.st'] = el => { UI.set('sop.st', el.dataset.v); tbl('sop').page = 1; App.rerender(); };
const SOP_ST = [['', 'Semua'], ['aktif', 'Aktif'], ['draft', 'Draf / diajukan'], ['due', 'Perlu tinjauan'], ['obsolete', 'Tidak berlaku']];
const stMatch = (s, f) => !f || (f === 'draft' ? (s.status === 'draft' || s.status === 'review' || !!s.pending || !!s.draft) : f === 'due' ? (() => { const d = sopDue(s); return !!d && d.level !== 'ok'; })() : s.status === f);
route(/^\/sop$/, () => {
  const q = UI.get('sop.q', '').trim().toLowerCase(), cat = UI.get('sop.cat', ''), st = UI.get('sop.st', '');
  const scored = DB.sops.map(s => Object.assign({}, s, { score: lintScore(sopLint(contentOf(s), s.code)) }));
  const rows = scored.filter(s => (!cat || s.cat === cat) && stMatch(s, st) && (!q || `${s.code} ${s.title} ${s.desc} ${s.owner} ${s.dept} ${s.isoClause}`.toLowerCase().includes(q)));
  const cats = catList().filter(c => DB.sops.some(s => s.cat === c[0]));
  return {
    title: 'Prosedur (SOP)',
    html: h`${pageHead('Prosedur (SOP)', `${DB.sops.length} dokumen · ${DB.sops.filter(s => s.status === 'aktif').length} aktif`, h`${link('#/master', 'Daftar induk', { icon: 'list' })}${can('sop.create') ? link('#/sop/new', 'SOP baru', { icon: 'plus', cls: 'primary' }) : ''}`)}
    <div class="toolbar"><label class="search" style="flex:1;min-width:220px;max-width:420px"><span class="sr">Cari SOP</span>${ico('search', 16)}<input class="input" type="search" placeholder="Cari kode, judul, pemilik proses…" value="${UI.get('sop.q', '')}" data-input="sop.q" data-keep="sop.q" autocomplete="off"></label>
      <div class="chips" role="group" aria-label="Status">${SOP_ST.map(([v, l]) => h`<button type="button" class="chip ${st === v ? 'on' : ''}" data-act="sop.st" data-v="${v}">${l}<span class="n">${DB.sops.filter(s => stMatch(s, v)).length}</span></button>`)}</div></div>
    <div class="toolbar" style="margin-top:-4px"><div class="chips" role="group" aria-label="Kategori"><button type="button" class="chip ${!cat ? 'on' : ''}" data-act="sop.cat" data-v="">Semua kategori</button>${cats.map(c => h`<button type="button" class="chip ${cat === c[0] ? 'on' : ''}" data-act="sop.cat" data-v="${c[0]}">${catDot(c[0])}${c[1]}<span class="n">${DB.sops.filter(s => s.cat === c[0]).length}</span></button>`)}</div></div>
    <section class="panel">${dataTable({
      id: 'sop', rows, pageSize: 20, empty: 'Tidak ada SOP yang cocok dengan pencarian atau filter.', rowAct: 'go', rowData: r => ({ 'data-href': sopUrl(r.code) }),
      cols: [
        { k: 'code', label: 'Kode', cls: 'code', render: r => h`<a href="#${sopUrl(r.code)}">${r.code}</a>` },
        { k: 'title', label: 'Judul', render: r => h`<b>${r.title}</b><div class="muted tiny">${trunc(r.desc, 90)}</div>` },
        { k: 'cat', label: 'Kategori', val: r => catLabel(r.cat), render: r => h`<span class="nowrap">${catDot(r.cat)}${catLabel(r.cat)}</span>` },
        { k: 'rev', label: 'Rev.', cls: 'c', render: r => r.status === 'draft' ? '—' : r.rev },
        { k: 'status', label: 'Status', val: r => sopStateText(r), render: r => h`${sopStatusBadge(r)}${r.draft && !r.pending ? h` ${badge(r.draft.status === 'ditolak' ? 'Revisi ditolak' : 'Draf revisi', r.draft.status === 'ditolak' ? 'danger' : 'info')}` : ''}` },
        { k: 'nextReview', label: 'Tinjauan', render: r => dueBadge(r) },
        { k: 'score', label: 'Kelengkapan', val: r => r.score, render: r => h`<div class="row nowrap" style="gap:8px;min-width:96px">${progress(r.score, r.score >= 90 ? 'ok' : r.score >= 70 ? 'warn' : 'danger')}<span class="tiny num">${r.score}%</span></div>` }
      ]
    })}</section>`
  };
}, { nav: 'sop' });

/* ---------- detail SOP ---------- */
ACT['sop.tab'] = el => App.go(sopUrl(el.dataset.code, el.dataset.id));
route(/^\/sop\/([^/]+)$/, (m, q) => {
  const code = routeCode(m[1]);
  if (code === 'new') return sopNewView();
  const s = sopByCode(code);
  if (!s) return { title: 'SOP tidak ditemukan', html: emptyBox('search', 'SOP tidak ditemukan', `Kode ${code} tidak ada. Mungkin sudah dihapus.`, link('#/sop', 'Kembali ke daftar', { cls: 'primary' })) };
  const tab = ['isi', 'doc', 'riwayat', 'terkait'].includes(q.tab) ? q.tab : 'isi';
  const hist = DB.hist[s.code] || [], lint = sopLint(contentOf(s), s.code), score = lintScore(lint);
  const tabs = [{ id: 'isi', label: 'Isi SOP' }, { id: 'doc', label: 'Dokumen A4' }, { id: 'riwayat', label: 'Riwayat revisi', badge: hist.length || '' }, { id: 'terkait', label: 'Terkait' }];
  const canEdit = sopCanEdit(s);
  const actions = h`${btn('Cetak / PDF', 'sop.print', { icon: 'printer', data: { code: s.code } })}${btn('Word', 'sop.word', { icon: 'word', data: { code: s.code } })}
    ${sopCanApprove(s) ? link('#/approval/' + enc(s.code), 'Tinjau pengajuan', { icon: 'award', cls: 'primary' }) : ''}
    ${canEdit ? link(`#/sop/${enc(s.code)}/edit`, s.status === 'draft' ? 'Edit draf' : s.draft ? 'Lanjutkan draf revisi' : 'Buat revisi', { icon: 'edit', cls: 'primary' }) : ''}
    ${menuHTML('', [
      can('sop.create') ? { label: 'Duplikat sebagai SOP baru', icon: 'copy', act: 'sop.dup', data: { code: s.code } } : null,
      s.status === 'aktif' && can('sop.approve') ? { label: 'Nonaktifkan (tidak berlaku)', icon: 'ban', act: 'sop.obs', data: { code: s.code } } : null,
      s.status === 'obsolete' && can('sop.approve') ? { label: 'Aktifkan kembali', icon: 'undo', act: 'sop.react', data: { code: s.code } } : null,
      s.pending && (sopCanApprove(s) || (Auth.user && s.pending.byUser === Auth.user.username)) ? { label: 'Tarik pengajuan', icon: 'undo', act: 'sop.withdraw', data: { code: s.code } } : null,
      can('sop.delete') ? { sep: true } : null,
      can('sop.delete') ? { label: 'Hapus SOP', icon: 'trash', act: 'sop.del', data: { code: s.code } } : null
    ], { icon: 'more', btn: 'icon', cls: '' })}`;
  let body, post = null;
  if (tab === 'doc') { const d = docHost(() => buildResult(sopSpec(s, { hist })), { title: `${s.code}-Rev${s.rev}` }); body = d.html; post = d.post; }
  else if (tab === 'riwayat') body = sopHistoryTab(s, hist);
  else if (tab === 'terkait') body = sopRelatedTab(s);
  else body = sopIsiTab(s, lint, score);
  const dr = s.draft;
  return {
    title: s.code, post,
    html: h`${crumbs(['SOP', '/sop'], [s.code])}
    ${pageHead(s.title, h`<span class="mono"><b>${s.code}</b></span> · ${catLabel(s.cat)} · ${s.owner || 'pemilik proses belum diisi'}`, actions)}
    ${s.pending ? h`<div class="callout warn">${ico('award', 18)}<div><b>Revisi diajukan oleh ${s.pending.by}</b> ${timeAgo(s.pending.at)} dan menunggu persetujuan.<div class="small">${s.pending.note || ''}</div></div>${sopCanApprove(s) ? link('#/approval/' + enc(s.code), 'Tinjau', { cls: 'sm primary' }) : ''}</div>` : ''}
    ${dr && !s.pending ? h`<div class="callout ${dr.status === 'ditolak' ? 'danger' : 'info'}">${ico(dr.status === 'ditolak' ? 'alert' : 'edit', 18)}<div><b>${dr.status === 'ditolak' ? 'Revisi ditolak' : 'Ada draf revisi yang belum diajukan'}</b> ${dr.by ? `· ${dr.by}` : ''}<div class="small">${dr.status === 'ditolak' ? 'Alasan: ' + dr.reason : (dr.note || 'Isi yang tampil di bawah masih versi terbit.')}</div></div>${canEdit ? link(`#/sop/${enc(s.code)}/edit`, 'Buka editor', { cls: 'sm' }) : ''}</div>` : ''}
    <div class="facts"><div class="fact"><span>Status</span>${sopStamp(s)}</div><div class="fact"><span>Revisi</span><b class="num">${s.status === 'draft' ? '—' : s.rev}</b></div><div class="fact"><span>Tanggal terbit</span><b>${s.effectiveDate ? fmtDate(s.effectiveDate) : '—'}</b></div><div class="fact"><span>Tinjauan berikutnya</span><b>${s.nextReview ? fmtDate(s.nextReview) : '—'}</b>${dueBadge(s, true)}</div><div class="fact"><span>Disetujui oleh</span><b>${s.approvedBy || '—'}</b></div><div class="fact"><span>Klausul ISO 9001</span><b>${s.isoClause || '—'}</b></div></div>
    ${tabsHTML(tabs, tab, 'sop.tab', { 'data-code': s.code })}${body}`
  };
}, { nav: 'sop' });

function sopIsiTab(s, lint, score) {
  const secs = sopView(contentOf(s));
  const issues = lint.filter(x => x.level !== 'ok');
  return h`<div class="grid g-main" style="align-items:start"><div class="stack">${secs.length ? secs.map(x => x.html) : emptyBox('filetext', 'SOP ini belum berisi apa pun', 'Buka editor untuk mengisi tujuan, prosedur, dan flowchart.')}</div>
    <aside class="stack sticky-col"><section class="panel"><div class="panel-h"><h3>Isi dokumen</h3></div><div class="panel-b stack-sm toc">${secs.map(x => h`<a href="#" data-act="toc.go" data-id="sec-${x.id}"><span class="sec-n">${x.n}</span>${x.title}</a>`)}</div></section>
    <section class="panel"><div class="panel-h"><h3>Kelengkapan</h3><span class="spacer"></span><b class="num" style="font-size:20px">${score}%</b></div><div class="panel-b stack-sm">${progress(score, score >= 90 ? 'ok' : score >= 70 ? 'warn' : 'danger')}${issues.length ? h`<ul class="lint">${issues.map(i => h`<li class="${i.level}">${ico(i.level === 'error' ? 'alert' : 'info', 14)}<span>${i.msg}</span></li>`)}</ul>` : h`<p class="small muted">Semua bagian wajib terisi.</p>`}</div></section></aside></div>`;
}
ACT['toc.go'] = el => { const t = byId(el.dataset.id); if (t) { t.scrollIntoView({ behavior: 'smooth', block: 'start' }); } };

/* ---------- riwayat revisi ---------- */
function sopHistoryTab(s, hist) {
  const rows = hist.map((x, i) => ({ x, i })).reverse();
  return h`<section class="panel"><div class="panel-h"><h2>Riwayat revisi</h2><span class="spacer"></span><span class="muted small">${hist.length} entri · tiap revisi menyimpan salinan lengkap isi SOP</span></div>
    <div class="panel-b flush">${rows.length ? h`<ol class="timeline">${rows.map(({ x, i }) => h`<li><span class="tl-dot ${i === hist.length - 1 ? 'on' : ''}"></span><div class="tl-b"><div class="row"><b class="num">Rev. ${x.rev}</b><span class="muted small">${fmtDate(x.date)}</span>${i === hist.length - 1 ? badge('Berlaku', 'ok') : ''}<span class="spacer"></span>
      <button class="btn sm" data-act="sop.view" data-code="${s.code}" data-i="${i}">${ico('eye', 14)}<span>Lihat</span></button>${i > 0 ? h`<button class="btn sm" data-act="sop.diff" data-code="${s.code}" data-a="${i - 1}" data-b="${i}">${ico('split', 14)}<span>Bandingkan dengan sebelumnya</span></button>` : ''}${sopCanEdit(s) && i < hist.length - 1 ? h`<button class="btn sm" data-act="sop.restore" data-code="${s.code}" data-i="${i}">${ico('undo', 14)}<span>Pulihkan sebagai draf</span></button>` : ''}</div>
      <p class="tl-note">${x.note || '—'}</p><div class="muted tiny">Disusun ${x.by || '—'} · Disetujui ${x.approvedBy || '—'}</div></div></li>`)}</ol>` : emptyBox('history', 'Belum ada riwayat', 'Riwayat tercatat saat SOP pertama kali terbit.')}</div></section>`;
}
ACT['sop.view'] = el => {
  const s = sopByCode(el.dataset.code), x = (DB.hist[el.dataset.code] || [])[+el.dataset.i]; if (!s || !x) return;
  const c = normContent(x.snap);
  openModal({ title: `${s.code} · Rev. ${x.rev} (${fmtDate(x.date)})`, size: 'lg', body: h`<div class="stack">${sopView(c).map(z => z.html)}</div>`, footer: h`<button class="btn primary" data-act="modal.ok">Tutup</button>` });
};
ACT['sop.diff'] = el => {
  const s = sopByCode(el.dataset.code), H = DB.hist[el.dataset.code] || [], a = H[+el.dataset.a], b = H[+el.dataset.b]; if (!s || !a || !b) return;
  const d = diffSop(normContent(a.snap), normContent(b.snap));
  openModal({ title: `Perubahan Rev. ${a.rev} → Rev. ${b.rev}`, size: 'xl', body: h`<p class="muted small">${b.note || ''}</p>${diffHTML(d)}`, footer: h`<button class="btn primary" data-act="modal.ok">Tutup</button>` });
};
ACT['sop.restore'] = async el => {
  const s = sopByCode(el.dataset.code), x = (DB.hist[el.dataset.code] || [])[+el.dataset.i]; if (!s || !x || !sopCanEdit(s)) return;
  if (!(await confirmBox({ title: 'Pulihkan sebagai draf?', text: `Isi Rev. ${x.rev} akan dimuat sebagai draf revisi. Isi SOP yang sedang berlaku tidak berubah sampai draf itu diajukan dan disetujui.`, ok: 'Pulihkan' }))) return;
  const e = sopSave(s, normContent(x.snap), `Memulihkan isi Rev. ${x.rev}`); if (e) return toast(e, 'danger');

};

/* ---------- terkait ---------- */

  const kp = s.kpi.map(kpiDef).filter(Boolean), back = sopBackRefs(s.code), kpiBy = DB.kpiDefs.filter(k => k.sop === s.code && !s.kpi.includes(k.id));

    <section class="panel"><div class="panel-h"><h3>Informasi administrasi</h3></div><div class="panel-b"><dl class="kvl"><dt>Dibuat</dt><dd>${fmtDT(s.createdAt)} · ${s.createdBy || '—'}</dd><dt>Diperbarui</dt><dd>${fmtDT(s.updatedAt)} · ${s.updatedBy || '—'}</dd><dt>Departemen</dt><dd>${s.dept || '—'}</dd><dt>Pemilik proses</dt><dd>${s.owner || '—'}</dd>${s.legacyVer ? h`<dt>Versi lama (v7.1)</dt><dd>${s.legacyVer}</dd>` : ''}</dl></div></section></div>`;
}

ACT['sop.dup'] = async el => {
  if (!can('sop.create')) return; const s = sopByCode(el.dataset.code); if (!s) return;
  const code = await promptBox({ title: 'Duplikat SOP', text: `Salinan ${s.code} dibuat sebagai draf baru.`, label: 'Kode dokumen baru', value: s.code + '-COPY', required: true, ok: 'Buat salinan' }); if (!code) return;

/* ---------- SOP baru ---------- */
const CAT_PREFIX = { warehouse: 'SOP/WHR/', dokumen: 'SOP/DOC/', mutu: 'SOP/QMS/', sdm: 'SOP/HR/', it: 'SOP/IT/' };

CHG['new.cat'] = el => { UI.set('new.cat', el.value); const i = byId('newCode'); if (i && (!i.value || /^SOP\/[A-Z]*\/?$/.test(i.value) || Object.values(CAT_PREFIX).includes(i.value))) i.value = CAT_PREFIX[el.value] || 'SOP/'; };

/* ---------- editor ---------- */
const ED = { code: null, c: null, tab: 'info', dirty: false, note: '', bump: true, focus: null, t: null };
const ED_TABS = [['info', 'Informasi'], ['tujuan', 'Tujuan & lingkup'], ['ref', 'Definisi & referensi'], ['resp', 'Tanggung jawab'], ['proc', 'Prosedur'], ['flow', 'Flowchart'], ['risk', 'KPI, risiko & formulir'], ['lamp', 'SLA & lampiran'], ['extra', 'Isian tambahan']];
const ED_ROWDEF = { proc: [0, '', '', ''], resp: ['', ''], definisi: ['', ''], risiko: ['', ''], referensi: '' };
const edSop = () => sopByCode(ED.code);
const edScratchKey = 'scratch';

function edInit(s) {
  ED.code = s.code; ED.c = sopWorking(s); ED.tab = 'info'; ED.dirty = false; ED.note = (s.draft && s.draft.note) || ''; ED.bump = s.draft ? s.draft.bump !== false : true; ED.focus = null;
  App.dirty = () => ED.dirty && !!byId('edRoot');
}
function edScratchSave() {
  clearTimeout(ED.t); ED.t = setTimeout(() => { if (ED.dirty && ED.code) Store.write(edScratchKey, { code: ED.code, c: ED.c, note: ED.note, at: Date.now() }); }, 700);
}
const edScratchClear = () => { clearTimeout(ED.t); Store.remove(edScratchKey); };
const edLint = () => { const s = edSop(); return sopLint(normContent(ED.c), s ? s.code : '', { id: s && s.id }); };

route(/^\/sop\/([^/]+)\/edit$/, (m, q, opts) => {
  const s = sopByCode(routeCode(m[1]));
  if (!s) return { title: 'SOP tidak ditemukan', html: emptyBox('search', 'SOP tidak ditemukan', '', link('#/sop', 'Kembali ke daftar', { cls: 'primary' })) };
  if (!sopCanEdit(s)) return { title: 'Tidak bisa diedit', html: h`${crumbs(['SOP', '/sop'], [s.code, sopUrl(s.code)], ['Editor'])}${emptyBox('lock', s.pending ? 'SOP sedang menunggu persetujuan' : 'SOP ini tidak bisa diedit', s.pending ? 'Isi dikunci selama pengajuan diperiksa. Tarik pengajuan dari halaman SOP bila ingin mengubah lagi.' : s.status === 'obsolete' ? 'SOP yang tidak berlaku tidak dapat direvisi. Aktifkan kembali dulu.' : 'Peran Anda tidak memiliki izin mengubah SOP ini.', link('#' + sopUrl(s.code), 'Kembali ke SOP', { cls: 'primary' }))}` };
  const fresh = !(opts && opts.keep) || ED.code !== s.code;
  if (fresh) edInit(s);
  KEYS.save = () => { if (byId('edRoot')) edSave(); };
  return {
    title: `Edit ${s.code}`,
    html: h`${crumbs(['SOP', '/sop'], [s.code, sopUrl(s.code)], ['Editor'])}
    ${pageHead(s.status === 'draft' ? 'Edit draf SOP' : 'Revisi SOP', h`<b>${s.code}</b> · ${s.status === 'draft' ? 'Dokumen baru, belum terbit' : `Revisi berlaku: Rev. ${s.rev}. Perubahan disimpan sebagai draf sampai diajukan dan disetujui.`}`, h`<a class="btn" href="#${sopUrl(s.code)}">${ico('arrowL', 15)}<span>Kembali ke SOP</span></a>`)}
    ${s.draft && s.draft.status === 'ditolak' ? h`<div class="callout danger">${ico('alert', 18)}<div><b>Revisi sebelumnya ditolak</b><div class="small">${s.draft.reason}</div></div></div>` : ''}
    <div id="edRoot"><div id="edTabs"></div><div class="grid g-main ed-grid" style="align-items:start"><div id="edBody" class="ed-body"></div><aside id="edSide" class="stack sticky-col"></aside></div></div>`,
    post: () => { edRenderTabs(); edRenderBody(); edRenderSide(); if (fresh) edOfferScratch(s); }
  };
}, { nav: 'sop' });

async function edOfferScratch(s) {
  const sc = Store.read(edScratchKey, null); if (!sc || sc.code !== s.code || !sc.c) return;
  if (sameContent(sc.c, ED.c)) { edScratchClear(); return; }
  if (await confirmBox({ title: 'Pulihkan perubahan yang belum disimpan?', text: `Ditemukan perubahan pada ${s.code} yang belum sempat disimpan (${timeAgo(sc.at)}). Pulihkan?`, ok: 'Pulihkan', cancel: 'Abaikan' })) {
    ED.c = normContent(sc.c); ED.note = sc.note || ''; ED.dirty = true; edRenderBody(); edRenderSide(); edRenderTabs();
  } else edScratchClear();
}
function edRenderTabs() {
  const lint = edLint(), per = {}; lint.forEach(i => { if (i.level === 'error') per[i.tab] = (per[i.tab] || 0) + 1; });
  const el = byId('edTabs'); if (!el) return;
  el.innerHTML = toHtml(tabsHTML(ED_TABS.map(([id, label]) => ({ id, label, badge: per[id] || '', bk: 'danger' })), ED.tab, 'ed.tab'));
}
ACT['ed.tab'] = el => { ED.tab = el.dataset.id; edRenderTabs(); edRenderBody(); window.scrollTo({ top: 0 }); };
function edRenderSide() {
  const s = edSop(), el = byId('edSide'); if (!el || !s) return;
  const lint = edLint(), score = lintScore(lint), errs = lint.filter(x => x.level === 'error').length;
  const isNew = s.status === 'draft';
  el.innerHTML = toHtml(h`
    <section class="panel"><div class="panel-b stack-sm">
      <button class="btn block" data-act="ed.save">${ico('save', 16)}<span>Simpan draf</span>${kbd('Ctrl S')}</button>
      <button class="btn block" data-act="ed.preview">${ico('eye', 16)}<span>Pratinjau A4</span></button>
      <button class="btn primary block" data-act="ed.submit" ${errs ? 'title="Masih ada isian wajib yang kosong"' : ''}>${ico('send', 16)}<span>${isNew ? 'Ajukan penerbitan' : 'Ajukan revisi'}</span></button>
      ${!isNew && s.draft ? h`<button class="btn danger block sm" data-act="ed.discard">${ico('trash', 14)}<span>Buang draf revisi</span></button>` : ''}
      <div class="muted tiny" id="edState">${ED.dirty ? 'Ada perubahan yang belum disimpan.' : 'Semua perubahan tersimpan.'}</div></div></section>
    <section class="panel"><div class="panel-h"><h3>Kelengkapan</h3><span class="spacer"></span><b class="num" style="font-size:20px">${score}%</b></div>
      <div class="panel-b stack-sm">${progress(score, score >= 90 ? 'ok' : score >= 70 ? 'warn' : 'danger')}
      ${lint.length ? h`<ul class="lint">${lint.map(i => h`<li class="${i.level}"><a href="#" data-act="ed.tab" data-id="${i.tab}">${ico(i.level === 'error' ? 'alert' : 'info', 14)}<span>${i.msg}</span></a></li>`)}</ul>` : h`<p class="small muted">Semua bagian wajib terisi. Siap diajukan.</p>`}</div></section>`);
}
const edRefresh = debounce(() => { edRenderSide(); edRenderTabs(); const f = byId('flowPrev'); if (f && ED.tab === 'flow') f.innerHTML = toHtml(flowPreview()); }, 250);
function edTouch() { ED.dirty = true; const st = byId('edState'); if (st) st.textContent = 'Ada perubahan yang belum disimpan.'; edScratchSave(); edRefresh(); }

/* sunting nilai dari input bernama path (mis. proc.2.1) */
function edSet(path, val) {
  if (path === 'cat' || /^(title|dept|owner|isoClause|desc|tujuan|scope|sla|lampiran)$/.test(path)) ED.c[path] = val;

INP['ed.in'] = el => edSet(el.name, el.value);

CHG['ed.pick'] = el => {

  if (el.checked && !a.includes(v)) a.push(v); else if (!el.checked) ED.c[k] = a.filter(x => x !== v);

};
CHG['ed.flowt'] = el => { const i = +el.dataset.i, n = ED.c.flow[i]; n.t = el.value; if (n.t !== 'decision') { delete n.no; delete n.back; } edTouch(); edRenderBody(); };
CHG['ed.flowback'] = el => { const n = ED.c.flow[+el.dataset.i]; if (el.value === '') delete n.back; else n.back = +el.value; edTouch(); };

/* operasi baris */
ACT['ed.row'] = el => {
  const { op, name } = el.dataset, i = +el.dataset.i, a = ED.c[name]; if (!a) return;
  const blank = () => { const d = ED_ROWDEF[name]; return Array.isArray(d) ? d.slice() : d; };
  if (op === 'add') { a.push(blank()); ED.focus = `${name}.${a.length - 1}${Array.isArray(ED_ROWDEF[name]) ? '.' + (name === 'proc' ? 1 : 0) : ''}`; }
  else if (op === 'up' && i > 0) [a[i - 1], a[i]] = [a[i], a[i - 1]];
  else if (op === 'down' && i < a.length - 1) [a[i + 1], a[i]] = [a[i], a[i + 1]];
  else if (op === 'del') a.splice(i, 1);
  else if (op === 'dup') a.splice(i + 1, 0, clone(a[i]));
  edTouch(); edRenderBody();

const inp = (name, val, ph, o = {}) => raw(`<input class="input sm" name="${esc(name)}" value="${esc(val)}" placeholder="${esc(ph || '')}" data-input="ed.in" autocomplete="off"${o.label ? ` aria-label="${esc(o.label)}"` : ''}>`);

    <div><button type="button" class="btn sm" data-act="ed.row" data-op="add" data-name="${name}">${ico('plus', 14)}<span>Tambah baris</span></button></div></div></section>`;

const RICH_HINT = 'Format: **tebal**, "- " untuk butir, "1. " untuk nomor, "## " untuk subjudul. Baris kosong memisahkan paragraf.';

function edRenderBody() {

      ${F.text('dept', 'Departemen', c.dept, { input: 'ed.in', ph: 'mis. Warehouse', list: 'dl-dept' })}

      ${F.select('isoClause', 'Klausul ISO 9001:2015', clauseOpts, c.isoClause, { cls: 'full', change: 'ed.in', help: 'Pemetaan ke klausul membantu saat audit sertifikasi.' })}

      <section class="panel"><div class="panel-h"><h3>Dokumen referensi</h3><span class="spacer"></span><span class="muted small">kode SOP lain otomatis menjadi tautan</span></div><div class="panel-b stack-sm">

      <div class="row"><button type="button" class="btn sm" data-act="ed.row" data-op="add" data-name="referensi">${ico('plus', 14)}<span>Tambah referensi</span></button>

  } else if (ED.tab === 'proc') {
    body = h`${rowsEditor('proc', [{ i: 1, ph: 'Aktivitas / langkah', area: true, rows: 2, label: 'Aktivitas' }, { i: 2, w: '22%', ph: 'PIC', label: 'PIC' }, { i: 3, w: '22%', ph: 'Waktu / standar', label: 'Waktu' }], 'Langkah prosedur', 'nomor diurutkan otomatis')}
      <div class="row" style="margin-top:10px"><button type="button" class="btn sm" data-act="ed.procimport">${ico('upload', 14)}<span>Impor dari teks</span></button><span class="muted small">Tempel daftar langkah: satu baris = satu langkah; pisahkan PIC dan waktu dengan tanda |</span></div>`;

ACT['ed.fmove'] = el => {
  const nodes = ED.c.flow, i = +el.dataset.i, j = i + +el.dataset.d; if (j < 0 || j >= nodes.length) return;
  const map = nodes.map((_, k) => k); map[i] = j; map[j] = i; [nodes[i], nodes[j]] = [nodes[j], nodes[i]];
  nodes.forEach(n => { if (n.back != null) n.back = map[n.back]; }); edTouch(); edRenderBody();
};
ACT['ed.fdel'] = el => {
  const nodes = ED.c.flow, i = +el.dataset.i; nodes.splice(i, 1);
  nodes.forEach(n => { if (n.back != null) { if (n.back === i) delete n.back; else if (n.back > i) n.back--; } }); edTouch(); edRenderBody();
};
ACT['ed.fadd'] = el => {
  const nodes = ED.c.flow; let at = +el.dataset.i; const t = el.dataset.t || 'process';
  if (el.dataset.t) { /* tombol di bawah daftar: sisipkan sebelum simpul "Selesai" terakhir */ at = nodes.length && nodes[nodes.length - 1].t === 'end' ? nodes.length - 1 : nodes.length; }
  nodes.forEach(n => { if (n.back != null && n.back >= at) n.back++; });
  nodes.splice(at, 0, t === 'decision' ? { t, l: '', no: '' } : { t, l: '' }); ED.focus = `flow.${at}.l`; edTouch(); edRenderBody();
};
ACT['ed.flowgen'] = async () => {
  const steps = ED.c.proc.filter(r => r[1]); if (!steps.length) return toast('Isi langkah prosedur dulu.', 'warn');
  if (ED.c.flow.some(n => n.l) && !(await confirmBox({ title: 'Ganti flowchart?', text: 'Flowchart saat ini diganti dengan urutan dari langkah prosedur (tanpa percabangan). Cabang keputusan bisa ditambahkan lagi setelahnya.', ok: 'Ganti', danger: true }))) return;
  ED.c.flow = [{ t: 'start', l: 'Mulai' }].concat(steps.map(r => ({ t: 'process', l: r[1] }))).concat([{ t: 'end', l: 'Selesai' }]); edTouch(); edRenderBody();
};
ACT['ed.procimport'] = async () => {
  const txt = await promptBox({ title: 'Impor langkah prosedur', text: 'Satu baris = satu langkah. Format: aktivitas | PIC | waktu', label: 'Daftar langkah', multiline: true, rows: 9, ph: 'Admin cocokkan surat jalan | Admin | 30 menit', ok: 'Impor', required: true }); if (!txt) return;
  const rows = txt.split(/\r?\n/).map(l => l.replace(/^\s*(\d+[.)]|[-•*])\s*/, '').trim()).filter(Boolean).map(l => { const p = l.split('|').map(x => x.trim()); return [0, p[0] || '', p[1] || '', p[2] || '']; });
  if (!rows.length) return;
  if (ED.c.proc.every(r => !r[1])) ED.c.proc = rows; else ED.c.proc = ED.c.proc.filter(r => r[1]).concat(rows);

};

function edSave(silent) {
  const s = edSop(); if (!s) return false;
  ED.c = normContent(ED.c); if (!ED.c.proc.length) ED.c.proc = [[1, '', '', '']]; if (!ED.c.resp.length) ED.c.resp = [['', '']];
  const e = sopSave(s, ED.c, ED.note); if (e) { toast(e, 'danger'); return false; }
  ED.dirty = false; edScratchClear(); logAct('Simpan draf SOP', s.code, ''); if (!silent) toast('Draf tersimpan.', 'ok');
  edRenderSide(); return true;
}
ACT['ed.save'] = () => edSave();
ACT['ed.discard'] = async () => {
  const s = edSop(); if (!s || !s.draft) return;
  if (!(await confirmBox({ title: 'Buang draf revisi?', text: 'Semua perubahan pada draf revisi ini dihapus. SOP yang berlaku tidak terpengaruh.', ok: 'Buang draf', danger: true }))) return;
  s.draft = null; dbSave('sops'); ED.dirty = false; edScratchClear(); logAct('Buang draf revisi', s.code, ''); toast('Draf revisi dibuang.', 'ok'); App.go(sopUrl(s.code));
};

};
ACT['ed.submit'] = () => {
  const s = edSop(); if (!s) return; const isNew = s.status === 'draft';
  const lint = edLint(), errs = lint.filter(x => x.level === 'error');
  if (errs.length) { toast(`Belum bisa diajukan: ${errs[0].msg}`, 'danger', 5000); ED.tab = errs[0].tab; edRenderTabs(); edRenderBody(); return; }
  if (!isNew && sameContent(ED.c, contentOf(s))) return toast('Belum ada perubahan dari isi yang berlaku.', 'warn');
  const fid = uid('sb'), warns = lint.filter(x => x.level === 'warn').length;
  openModal({
    title: isNew ? 'Ajukan penerbitan SOP' : 'Ajukan revisi untuk disetujui', size: 'sm',
    body: h`<form id="${fid}" data-submit="ed.submit" class="stack">${warns ? h`<div class="callout warn" style="margin:0">${ico('info', 16)}<div class="small">Ada ${warns} saran kelengkapan. SOP tetap bisa diajukan.</div></div>` : ''}
      ${isNew ? h`<p class="modal-text">SOP akan dikirim ke Supervisor/Administrator untuk disetujui. Selama diperiksa, isinya dikunci.</p>` : h`${F.area('note', 'Uraian perubahan', ED.note, { rows: 3, req: true, help: 'Ringkas apa yang berubah dan alasannya.' })}${F.check('bump', 'Naikkan nomor revisi (disarankan)', ED.bump, { help: `Rev. ${s.rev} → Rev. ${nextRevStr(s.rev)} saat disetujui.` })}`}</form>`,
    footer: h`<button class="btn" data-act="modal.cancel">Batal</button><button class="btn primary" type="submit" form="${fid}">Ajukan</button>`
  });
};
SUB['ed.submit'] = f => {
  const s = edSop(); if (!s) return; const d = formObj(f);
  if (s.status !== 'draft' && !String(d.note || '').trim()) return toast('Uraian perubahan wajib diisi.', 'danger');
  ED.note = d.note || ED.note; ED.bump = d.bump !== false && d.bump !== undefined ? !!d.bump : ED.bump;
  if (!edSave(true)) return;
  const e = sopSubmit(s, ED.note, !!d.bump || s.status === 'draft'); if (e) return toast(e, 'danger', 6000);

/* ---------- penanganan isian ---------- */
function edXSet(el) {
  const sec = edXFind(el.dataset.id); if (!sec) return;
  const v = edXVal(sec, true), i = +el.dataset.i, j = +el.dataset.j;
  if (sec.kind === 'text') ED.c.extra[sec.id] = el.value;
  else if (sec.kind === 'table') { if (v[i]) v[i][j] = el.value; }
  else if (i >= 0 && i < v.length) v[i] = el.value;
  edTouch();
}
INP['ed.x'] = edXSet; CHG['ed.x'] = edXSet;
ACT['ed.xrow'] = el => {
  const sec = edXFind(el.dataset.id); if (!sec) return;
  const v = edXVal(sec, true), op = el.dataset.op, i = +el.dataset.i, n = Math.max(1, (sec.cols || []).length);
  if (op === 'add') { if (v.length >= 300) return toast('Maksimal 300 baris per bagian.', 'warn'); v.push(sec.kind === 'table' ? Array.from({ length: n }, () => '') : ''); ED.focus = sec.kind === 'table' ? `x.${sec.id}.${v.length - 1}.0` : `x.${sec.id}.${v.length - 1}`; }
  else if (op === 'up' && i > 0) [v[i - 1], v[i]] = [v[i], v[i - 1]];
  else if (op === 'down' && i < v.length - 1) [v[i + 1], v[i]] = [v[i], v[i + 1]];
  else if (op === 'del') v.splice(i, 1);
  edTouch(); edRenderBody();
};
/* tampil / judul per SOP */
CHG['ed.sec.show'] = el => { const s = edSecs(), id = el.dataset.id; s.hide = s.hide.filter(x => x !== id); if (!el.checked) s.hide.push(id); edTouch(); edRenderBody(); };
INP['ed.sec.title'] = el => { const s = edSecs(), id = el.dataset.id, v = el.value.trim(); if (v) s.title[id] = v; else delete s.title[id]; edTouch(); };
/* bagian khusus SOP ini */
const edXAdd = el => edSecs().add.find(x => x.id === el.dataset.id);
ACT['ed.sec.add'] = () => {
  const s = edSecs(); if (s.add.length >= 30) return toast('Maksimal 30 bagian tambahan per SOP.', 'warn');
  const last = resolveSections(ED.c).filter(x => x.id !== 'riwayat').pop(), id = newSecId();
  s.add.push({ id, title: 'Bagian baru', kind: 'text', after: last ? last.id : '' }); ED.focus = `xs.${id}.title`; edTouch(); edRenderBody();
};
INP['ed.sec.add.title'] = el => { const a = edXAdd(el); if (a) { a.title = el.value; edTouch(); } };
CHG['ed.sec.add.kind'] = el => { const a = edXAdd(el); if (!a) return; a.kind = SEC_KINDS.some(k => k[0] === el.value) ? el.value : 'text'; if (a.kind === 'table' && !(a.cols || []).length) a.cols = ['Kolom 1', 'Kolom 2']; edTouch(); edRenderBody(); };
INP['ed.sec.add.cols'] = el => { const a = edXAdd(el); if (a) { a.cols = el.value.split(',').map(x => x.trim()).filter(Boolean).slice(0, 8); edTouch(); } };
CHG['ed.sec.add.after'] = el => { const a = edXAdd(el); if (a) { a.after = el.value; edTouch(); } };
CHG['ed.sec.add.req'] = el => { const a = edXAdd(el); if (a) { a.req = el.checked; edTouch(); } };
ACT['ed.sec.del'] = async el => {
  const s = edSecs(), a = s.add.find(x => x.id === el.dataset.id); if (!a) return;
  if (!(await confirmBox({ title: 'Hapus bagian ini?', text: `Bagian "${a.title}" beserta isinya dihapus dari SOP ini (belum tersimpan sampai Anda menyimpan draf).`, ok: 'Hapus bagian', danger: true }))) return;
  s.add = s.add.filter(x => x.id !== a.id); s.hide = s.hide.filter(x => x !== a.id); delete s.title[a.id]; if (ED.c.extra) delete ED.c.extra[a.id];
  edTouch(); edRenderBody();
};

const isoTokens = s => String(s || '').match(/\d+(?:\.\d+)*/g) || [];
function isoCoverage() {
  const live = DB.sops.filter(s => s.status !== 'obsolete');
  return ISO_CLAUSES.map(([c, t]) => {
    const direct = [], via = [];
    live.forEach(s => {
      const toks = isoTokens(s.isoClause);
      if (toks.includes(c)) direct.push(s);
      else if (toks.some(k => c.startsWith(k + '.') || k.startsWith(c + '.'))) via.push(s);

}

/* ---------- penerbitan ---------- */
let LT_BUSY = false, BK_BUSY = false;
function ltBuild(S, mode, seq0) {
  const t = letterType(S.typeId); let no, seq = 0, key = '';
  if (S.useManual) no = S.manualNo.trim(); else { key = counterKey(t.id, S.date); seq = seq0; no = numFormat(null, { seq, kode: t.prefix, date: S.date }); }
  const L = composeLetter(S, { no });
  const rec = Object.assign({ id: uid('ltr'), seq, key, status: 'terbit', manual: !!S.useManual, reserved: mode === 'reserve', createdAt: Date.now(), createdBy: Auth.user.name, createdByUser: Auth.user.username }, L);
  if (mode === 'reserve') { rec.body = ''; rec.items = []; }
  return rec;
}
/* nomor resmi diambil dari server (atomik) — dua pengguna tidak akan pernah mendapat nomor sama */
async function ltCommit(S, mode) {
  if (S.useManual) return ltBuild(S, mode, 0);
  const t = letterType(S.typeId); let p = peekNumber(t.id, S.date), seq = p.seq;
  for (let i = 0; i < 8; i++) {
    seq = await Cloud.claim(p.key, p.seq);
    const no = numFormat(null, { seq, kode: t.prefix, date: S.date });
    if (!DB.letters.some(l => l.no === no)) break;
    p = { key: p.key, seq: seq + 1 };
  }
  return ltBuild(S, mode, seq);
}
function ltSaveRecs(recs) {
  const prev = {}; recs.forEach(r => { if (r.key && !(r.key in prev)) prev[r.key] = DB.counters[r.key]; });
  const keys = Object.keys(prev);
  recs.slice().reverse().forEach(r => DB.letters.unshift(r));
  const maxSeq = {}; recs.forEach(r => { if (r.key) maxSeq[r.key] = Math.max(maxSeq[r.key] || 0, r.seq); });
  keys.forEach(k => { DB.counters[k] = Math.max(DB.counters[k] || 0, maxSeq[k]); });
  if (dbSave('letters', 'counters')) return true;
  recs.forEach(r => { const i = DB.letters.indexOf(r); if (i >= 0) DB.letters.splice(i, 1); });
  keys.forEach(k => { if (prev[k] === undefined) delete DB.counters[k]; else DB.counters[k] = prev[k]; });
  return false;
}
async function ltIssue(mode) {

  const S = ltState(), err = ltValidate(S, mode); if (err) return toast(err, 'danger');

  try {
    rec = await ltCommit(S, mode); ltSaveRecs([rec]);
    const fr = await Cloud.flushNow();
    if (fr.by.letters !== 'ok') return toast(fr.by.letters === 'unique' ? 'Nomor surat bentrok dengan pengguna lain. Data dimuat ulang — silakan terbitkan lagi.' : 'Surat belum tersimpan di server: ' + (Cloud.lastError || 'coba lagi.'), 'danger', 8000);
  } catch (e) { return toast(cloudMsg(e), 'danger', 8000); } finally { LT_BUSY = false; }
  logAct(mode === 'reserve' ? 'Ambil nomor surat' : 'Terbitkan surat', rec.no, `${rec.typeName} · ${rec.subject}`);
  LT.g = null; Store.remove(ltDraftKey());
  toast(mode === 'reserve' ? `Nomor ${rec.no} dicadangkan.` : `Surat ${rec.no} diterbitkan.`, 'ok');
  App.go('/register/' + enc(rec.id));
}

}

  if (t.layout === 'ba' && !t.subject) add('warn', 'Berita acara memakai perihal sebagai judul — isi perihal bawaan.');

  const list = Array.isArray(j) ? j : arr(j && j.types); if (!list.length) return toast('Tidak ada template di berkas ini.', 'danger');
  const ok = [], bad = [];
  list.forEach(x => { const t = normType(x), er = teLint(t, false).filter(l => l.level === 'error'); if (er.length) bad.push(`${t.id || '?'}: ${er[0].msg}`); else ok.push(t); });
  if (!ok.length) return toast(`Semua template ditolak. ${bad[0]}`, 'danger', 9000);
  const clash = ok.filter(t => letterType(t.id));
  if (!(await confirmBox({ title: `Impor ${ok.length} template?`, html: `${clash.length ? `${clash.length} template berkode sama akan <b>ditimpa</b> (${esc(clash.map(t => t.id).join(', '))}).` : 'Semua template berkode baru.'}${bad.length ? `<br><br>${bad.length} template ditolak karena tidak valid.` : ''}`, ok: 'Impor' }))) return;
  ok.forEach(t => { const i = DB.letterTypes.findIndex(x => x.id === t.id); if (i >= 0) DB.letterTypes[i] = t; else DB.letterTypes.push(t); });
  dbSave('letterTypes'); logAct('Impor template surat', '', `${ok.length} template`); TE.dirty = false; TE.d = null; toast(`${ok.length} template diimpor.`, 'ok'); App.rerender();
};

/* ---- 38-v-kpi.js ---- */
/* =====================================================================
   38-v-kpi.js — KPI & sasaran mutu: ringkasan, input bulanan, detail tren, definisi indikator
   Data: DB.kpiDefs [{id,name,unit,target,dir:'up'|'down',sop,owner,freq,desc?}]
         DB.kpiData [{kpi,period:'YYYY-MM',value,note?,by?,at?,sample?}]
   ===================================================================== */
const KPI_FREQ = ['Bulanan', 'Triwulanan', 'Semesteran', 'Tahunan'];
const KPI_UNITS = ['%', 'jam', 'hari', 'menit', 'kali', 'unit', 'Rp'];
const KG = { period: '', vals: {}, err: {}, dirty: false, live: false, lastTab: '' };

/* ---------- pembantu ---------- */
const kpiDirTxt = k => (k.dir === 'down' ? '≤ ' : '≥ ');
const kpiTargetTxt = k => `${kpiDirTxt(k)}${fmtNum(k.target)}${k.unit || ''}`;
const kpiRec = (id, period) => DB.kpiData.find(d => d.kpi === id && d.period === period);
const kpiValTxt = (k, v) => `${fmtNum(v)}${k.unit || ''}`;
const kpiSlug = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 20);
const kpiBadge = st => badge(st.label, st.k === 'ok' ? 'ok' : st.k === 'warn' ? 'warn' : st.k === 'danger' ? 'danger' : 'mute');
const kpiOkPeriod = p => /^\d{4}-(0[1-9]|1[0-2])$/.test(String(p || ''));
/* angka dengan koma desimal / titik ribuan gaya Indonesia: "98,5" "1.234,5" "99.5" "98,5%" */
function kpiParseVal(s) {
  s = String(s == null ? '' : s).trim().replace(/\s/g, '').replace(/%$/, '');
  if (!s) return NaN;
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d+,\d+$/.test(s)) s = s.replace(',', '.');
  else if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  const n = Number(s); return isFinite(n) ? n : NaN;
}
const kpiCheckVal = (k, v) => !isFinite(v) ? 'Isi dengan angka, mis. 98,5.' : (k.unit === '%' && (v < 0 || v > 100)) ? 'Nilai persen harus antara 0 dan 100.' : Math.abs(v) > 1e9 ? 'Angka terlalu besar.' : '';
function kpiDelta(k, cur, prev) {
  cur = Number(cur); prev = Number(prev); if (!isFinite(cur) || !isFinite(prev)) return null;
  const d = Math.round((cur - prev) * 10000) / 10000;
  return { d, good: d === 0 ? null : (k.dir === 'down' ? d < 0 : d > 0), txt: (d > 0 ? '+' : d < 0 ? '−' : '') + fmtNum(Math.abs(d)) + (k.unit === '%' ? ' pp' : k.unit ? ' ' + k.unit : '') };
}
const kpiDeltaHTML = dl => dl ? h`<span class="kdelta ${dl.good == null ? 'flat' : dl.good ? 'good' : 'bad'}">${dl.d === 0 ? '=' : dl.d > 0 ? '▲' : '▼'} ${dl.txt}</span>` : h`<span class="muted">—</span>`;
function kpiTrend(k, vals) {
  const v = vals.map(Number).filter(isFinite); if (v.length < 2) return null;
  const n = Math.min(3, Math.floor(v.length / 2)), avg = a => a.reduce((s, x) => s + x, 0) / a.length;
  const d = avg(v.slice(-n)) - avg(v.slice(-2 * n, -n)), eps = 0.02 * Math.max(Math.abs(Number(k.target)) || 1, 1);
  if (Math.abs(d) < eps) return { k: 'flat', label: 'Stabil', d };
  return ((k.dir === 'down' ? d < 0 : d > 0) ? { k: 'good', label: 'Membaik', d } : { k: 'bad', label: 'Memburuk', d });
}
function kpiMonths(extra) {
  const set = new Set(arr(extra)); let m = curMonthKey();
  for (let i = 0; i < 36; i++) { set.add(m); m = prevMonthKey(m); }
  DB.kpiData.forEach(d => { if (kpiOkPeriod(d.period)) set.add(d.period); });
  return Array.from(set).sort().reverse();
}
const kpiMonthPairs = extra => kpiMonths(extra).map(p => [p, fmtMonth(p)]);
const kpiLatestPeriod = () => { const ps = DB.kpiData.map(d => d.period).filter(kpiOkPeriod).sort(); return ps.length ? ps[ps.length - 1] : prevMonthKey(curMonthKey()); };
const kpiCurPeriod = () => { const p = UI.get('kpi.period', ''); return kpiOkPeriod(p) ? p : kpiLatestPeriod(); };
function kpiDefaultInputPeriod() {
  const pm = prevMonthKey(curMonthKey());
  return DB.kpiDefs.some(k => { const r = kpiRec(k.id, pm); return !r || r.sample; }) ? pm : curMonthKey();
}
function kpiPersist(snap, keys) {
  if (dbSave(...keys)) return true;
  if (snap.kpiData) DB.kpiData = snap.kpiData; if (snap.kpiDefs) DB.kpiDefs = snap.kpiDefs;
  toast('Gagal menyimpan: penyimpanan browser penuh. Unduh cadangan lalu hapus data lama.', 'danger', 8000); return false;
}
function kpiAfterSave(items, period) {
  const below = items.filter(x => kpiStatus(x.k, x.val).k === 'danger');
  if (below.length) notify('warn', 'KPI di bawah target', `${below.slice(0, 4).map(x => x.k.name).join(', ')}${below.length > 4 ? ` +${below.length - 4}` : ''} · ${fmtMonth(period)}`, items.length === 1 ? '/kpi?id=' + enc(items[0].k.id) : '/kpi?period=' + period, 'cap:kpi.manage');
}

/* =====================================================================
   RINGKASAN
   ===================================================================== */
function kpiOverviewHTML(period) {
  const prev = prevMonthKey(period);
  const rows = DB.kpiDefs.map(k => {
    const r = kpiRec(k.id, period), p = kpiRec(k.id, prev);
    return { k, r, st: r ? kpiStatus(k, r.value) : kpiStatus(k, NaN), dl: r && p ? kpiDelta(k, r.value, p.value) : null, ser: kpiSeries(k.id).filter(d => d.period <= period).slice(-6) };
  });
  const filled = rows.filter(x => x.r), cnt = key => rows.filter(x => x.st.k === key).length;
  const avg = filled.length ? filled.reduce((s, x) => s + x.st.a, 0) / filled.length : NaN, warn = DB.settings.kpiWarn || 95;
  const noAnalysis = rows.filter(x => x.st.k === 'danger' && !(x.r && x.r.note)).length, missing = rows.length - filled.length;
  const hp = []; for (let m = period, i = 0; i < 6; i++, m = prevMonthKey(m)) hp.unshift(m);
  const stats = h`<div class="stats">
    ${statCard('Capaian rata-rata', isFinite(avg) ? fmtNum(avg, 1) + '%' : '—', { icon: 'target', cls: !isFinite(avg) ? '' : avg >= 100 ? 'ok' : avg >= warn ? 'warn' : 'danger', sub: `${filled.length} dari ${rows.length} indikator terisi` })}
    ${statCard('Tercapai', cnt('ok'), { icon: 'check', cls: cnt('ok') ? 'ok' : '' })}
    ${statCard('Mendekati target', cnt('warn'), { icon: 'clock', cls: cnt('warn') ? 'warn' : '' })}
    ${statCard('Di bawah target', cnt('danger'), { icon: 'alert', cls: cnt('danger') ? 'danger' : '', sub: cnt('danger') ? (noAnalysis ? `${noAnalysis} belum ada catatan analisis` : 'semua sudah dianalisis') : 'tidak ada' })}
    ${statCard('Belum diisi', missing, { icon: 'edit', cls: missing ? 'warn' : '', sub: missing && can('kpi.input') ? 'isi lewat tab Input bulanan' : missing ? 'menunggu input data' : 'lengkap' })}
  </div>`;
  const table = dataTable({
    id: 'kpi', pageSize: 60, empty: 'Belum ada indikator.', rows,
    cols: [
      { k: 'name', label: 'Indikator', val: x => x.k.name, render: x => h`<a href="#/kpi?id=${enc(x.k.id)}"><b>${x.k.name}</b></a>${x.r && x.r.sample ? h` ${badge('contoh', 'warn')}` : ''}<div class="tiny muted">${x.k.owner || ''}${x.k.sop ? ' · ' + x.k.sop : ''}</div>` },
      { k: 'target', label: 'Target', cls: 'num nowrap', val: x => Number(x.k.target), render: x => kpiTargetTxt(x.k) },
      { k: 'value', label: 'Nilai', cls: 'num nowrap', val: x => x.r ? x.r.value : -1e18, render: x => x.r ? h`<b>${kpiValTxt(x.k, x.r.value)}</b>` : h`<span class="muted">—</span>` },
      { k: 'delta', label: 'vs bulan lalu', cls: 'nowrap', val: x => x.dl ? x.dl.d : -1e18, render: x => kpiDeltaHTML(x.dl) },
      { k: 'ach', label: 'Capaian', val: x => isFinite(x.st.a) ? x.st.a : -1, render: x => x.r ? h`<div class="row nowrap" style="gap:8px;min-width:110px">${progress(x.st.a, x.st.k)}<span class="tiny nowrap">${fmtNum(x.st.a, 1)}%</span></div>` : '' },
      { k: 'trend', label: 'Tren', sort: false, render: x => sparkline(x.ser.map(d => d.value), { target: x.k.target, color: stColor(x.st.k) }) },
      { k: 'status', label: 'Status', val: x => x.st.label, render: x => h`${kpiBadge(x.st)}${x.st.k === 'danger' && x.r && !x.r.note ? h`<div class="tiny kpi-warn">belum ada analisis</div>` : ''}` }
    ]
  });
  const map = h`<div class="tbl-wrap"><table class="table dense kmap"><thead><tr><th>Indikator</th>${hp.map(p => h`<th class="c">${fmtMonthS(p)}</th>`)}</tr></thead><tbody>${DB.kpiDefs.map(k => h`<tr><td><a href="#/kpi?id=${enc(k.id)}">${k.name}</a> <span class="tiny muted">${kpiTargetTxt(k)}</span></td>${hp.map(p => { const r = kpiRec(k.id, p), st = r ? kpiStatus(k, r.value) : null; return h`<td class="kc ${st ? st.k : 'none'}" title="${st ? `${fmtMonth(p)}: ${kpiValTxt(k, r.value)} — ${st.label}` : `${fmtMonth(p)}: belum ada data`}">${r ? fmtNum(r.value) : '·'}</td>`; })}</tr>`)}</tbody></table></div>
    <div class="kmap-legend"><span><i class="kc ok"></i>Tercapai</span><span><i class="kc warn"></i>Mendekati (≥ ${warn}%)</span><span><i class="kc danger"></i>Di bawah target</span><span><i class="kc none"></i>Belum ada data</span></div>`;
  return h`${stats}
    <section class="panel"><div class="panel-h"><h2>Capaian per indikator</h2><span class="muted small">${fmtMonth(period)}</span></div><div class="panel-b flush">${table}</div></section>
    ${DB.kpiDefs.length ? h`<section class="panel" style="margin-top:16px"><div class="panel-h"><h2>Peta capaian 6 bulan terakhir</h2></div><div class="panel-b flush">${map}</div></section>` : ''}`;
}

    e.preventDefault(); const all = $$('.kpi-in', byId('kgRoot')), i = all.indexOf(e.target), nx = all[i + (e.shiftKey ? -1 : 1)]; if (nx) { nx.focus(); nx.select(); }
  }

    const e = KG.vals[k.id], r0 = String(e.v || '').trim(), note = String(e.n || '').trim().slice(0, 600), ex = kpiRec(k.id, p);
    if (!r0) { if (ex && e.had) items.push({ k, del: true, note: '' }); return; }
    const val = Math.round(kpiParseVal(r0) * 10000) / 10000;
    if (ex && !ex.sample && ex.value === val && (ex.note || '') === note) return;

    cVal = col(['nilai', 'value', 'capaian', 'hasil', 'realisasi', 'aktual', 'actual']), cNote = col(['catatan', 'keterangan', 'note', 'notes', 'analisis', 'catatan_analisis']);
  const items = [];

    rows.slice(1).forEach((r, i) => items.push({ line: i + 2, ref: r[cId >= 0 ? cId : cName] || (cName >= 0 ? r[cName] : '') || '', per: r[cPer], raw: r[cVal], note: cNote >= 0 ? r[cNote] || '' : '', hasNote: cNote >= 0 }));
  } else {

    if (!pc.length) return { error: 'Format kolom tidak dikenali. Pakai kolom kpi_id (atau indikator), periode, nilai, catatan — atau satu baris per indikator dengan kolom bulan (mis. 2026-09 atau Sep 2026).' };
    rows.slice(1).forEach((r, i) => pc.forEach(c => { if (String(r[c.i] || '').trim() !== '') items.push({ line: i + 2, ref: r[label] || '', per: rows[0][c.i], raw: r[c.i], note: '', hasNote: false }); }));
  }

    if (!x.def) { x.status = 'tolak'; x.msg = x.ref ? `Indikator "${x.ref}" tidak ada di daftar` : 'Indikator kosong'; }
    else if (!x.period) { x.status = 'tolak'; x.msg = `Periode "${x.per || ''}" tidak dikenali`; }
    else if (String(x.raw || '').trim() === '') { x.status = 'tolak'; x.msg = 'Nilai kosong'; }

      ${bad.length && !show.some(x => x.status === 'tolak') ? h`<div class="callout warn">${ico('alert', 18)}<div>${bad.length} baris ditolak, mis. baris ${bad[0].line}: ${bad[0].msg}.</div></div>` : ''}

/* =====================================================================
   39-v-audit.js — audit internal & tindakan korektif (CAPA): daftar, detail, alur status, verifikasi
   Rekaman DB.audits: {id 'AUD-YYYY-NNN', date, auditor, auditee, clause, category, sop, finding, evidence, rootCause,
     action, preventive, pic, due, impl, status, verify:{date,by,result,note}|null, log:[{ts,user,act,from,to,note}],
     createdAt, createdBy, closedAt, sample?}
   ===================================================================== */
const AUD_CAT_INFO = {
  Mayor: 'Ketidaksesuaian besar: persyaratan tidak dipenuhi dan berdampak pada hasil layanan atau seluruh sistem.',
  Minor: 'Ketidaksesuaian kecil / kasus tunggal yang tidak mengganggu sistem secara keseluruhan.',
  Observasi: 'Potensi ketidaksesuaian — perlu diperhatikan sebelum menjadi temuan.',

const AUD_ST_KIND = { 'Terbuka': 'warn', 'Dalam Proses': 'info', 'Verifikasi': 'line', 'Selesai': 'ok' };
const audCatBadge = c => badge(c, c === 'Mayor' ? 'danger' : c === 'Minor' ? 'warn' : c === 'Observasi' ? 'info' : 'mute', AUD_CAT_INFO[c]);
const audStBadge = s => badge(s, AUD_ST_KIND[s] || 'mute');
const audOverdue = a => a.status !== 'Selesai' && !!a.due && a.due < todayISO();
const audById = id => DB.audits.find(a => a.id === id);
const audWho = () => (Auth.user ? Auth.user.name : '');
function audIsoTitle(code) {
  const p = String(code || '').trim().split('.'); if (!p[0]) return '';
  while (p.length) { const f = ISO_CLAUSES.find(x => x[0] === p.join('.')); if (f) return f[1]; p.pop(); }
  return '';
}
function audNextId(dateISO) {
  const y = String(dateISO || todayISO()).slice(0, 4); let m = 0;
  DB.audits.forEach(a => { const mm = /^AUD-(\d{4})-(\d+)$/.exec(a.id); if (mm && mm[1] === y) m = Math.max(m, +mm[2]); });
  return `AUD-${y}-${pad(m + 1, 3)}`;
}
function audFix(a) {
  if (!Array.isArray(a.log)) a.log = [];
  ['evidence', 'rootCause', 'preventive', 'impl', 'pic', 'sop', 'clause', 'auditor', 'auditee', 'action', 'finding'].forEach(k => { if (a[k] == null) a[k] = ''; });
  if (a.verify === undefined) a.verify = null; return a;
}
function audNeed(a, to) {
  const m = [];
  if (to === 'Dalam Proses' || to === 'Verifikasi') {
    if (['Mayor', 'Minor'].includes(a.category) && !String(a.rootCause).trim()) m.push('analisis akar masalah');
    if (!String(a.action).trim()) m.push('tindakan koreksi / korektif');
    if (!String(a.pic).trim()) m.push('PIC');
    if (!a.due) m.push('jatuh tempo');
  }
  if (to === 'Verifikasi' && !String(a.impl).trim()) m.push('bukti pelaksanaan tindakan');
  return m;
}
function audPersist(snap) {
  if (dbSave('audits')) return true;
  DB.audits = snap; toast('Gagal menyimpan: penyimpanan browser penuh. Unduh cadangan lalu hapus data lama.', 'danger', 8000); return false;
}

function audSetStatus(a, to, note, patch) {

const CAP_LABEL = {

  'config.manage': 'Mengatur kop, penandatangan & kebijakan', 'user.manage': 'Mengelola pengguna', 'data.backup': 'Mengunduh backup', 'data.restore': 'Memulihkan data', 'activity.view': 'Melihat log aktivitas'
};
const usrIsDefaultPw = u => !!u.mustChange && !u.pwChanged;
const usrRoleKind = r => ({ admin: 'danger', supervisor: 'info', staff: 'ok', viewer: 'mute' }[r] || 'mute');
const usrMe = u => !!(Auth.user && Auth.user.username === u.username);

/* kata sandi acak yang mudah dibaca (tanpa huruf/angka yang mirip) */
function genPassword(len = 10) {
  const L = 'abcdefghjkmnpqrstuvwxyz', U = 'ABCDEFGHJKMNPQRSTUVWXYZ', D = '23456789';
  const rnd = n => { const a = new Uint32Array(1); try { crypto.getRandomValues(a); } catch (e) { a[0] = Math.floor(Math.random() * 4294967296); } return a[0] % n; };
  const pick = (set, n) => Array.from({ length: n }, () => set[rnd(set.length)]);
  for (let t = 0; t < 20; t++) {
    const c = pick(L, len - 4).concat(pick(U, 2), pick(D, 2));
    for (let i = c.length - 1; i > 0; i--) { const j = rnd(i + 1); [c[i], c[j]] = [c[j], c[i]]; }
    const pw = c.join(''); if (!pwPolicy(pw, '')) return pw;
  }
  return 'Ez' + Date.now().toString(36).slice(-6) + '7k';
}
function usrStatus(u) {
  if (u.disabled) return badge('Nonaktif', 'mute');
  const li = Auth.lockInfo(u.username), out = [];
  if (li.locked) out.push(badge(`Terkunci ${Math.ceil(li.sec / 60)} mnt`, 'danger', 'Terlalu banyak percobaan masuk yang gagal'));
  else out.push(badge('Aktif', 'ok'));
  if (usrIsDefaultPw(u)) out.push(badge('Sandi bawaan', 'warn', 'Belum pernah mengganti kata sandi awal'));
  return h`${out.map(x => h`${x} `)}`;
}

      { label: 'Aksi', cls: 'tr nowrap', render: r => h`${iconBtn('edit', 'usr.edit', 'Ubah nama / peran', { data: { u: r.username } })}${iconBtn('lock', 'usr.pw', 'Atur ulang kata sandi', { data: { u: r.username } })}${Auth.lockInfo(r.username).locked ? iconBtn('refresh', 'usr.unlock', 'Buka kunci akun', { data: { u: r.username } }) : ''}${iconBtn('ban', 'usr.toggle', r.disabled ? 'Aktifkan akun' : 'Nonaktifkan akun', { data: { u: r.username } })}${iconBtn('trash', 'usr.del', 'Hapus akun', { data: { u: r.username } })}` }

function cfValidate() {

  if (Number(m.l) + Number(m.r) >= 190) out.push(['error', 'Jumlah margin kiri dan kanan terlalu besar untuk kertas A4.', 'fmt']);

}

async function cfShrink(file, kind) {
  const o = CF_IMG[kind] || CF_IMG.logo;
  if (/svg/i.test(file.type)) { const uri = await readFileDataURL(file); if (uri.length > o.budget) throw new Error(`SVG terlalu besar untuk ${o.label}. Ekspor ulang sebagai PNG.`); return uri; }
  let uri = await shrinkImage(file, { maxW: o.w, maxH: o.h, type: 'image/png' });
  if (uri.length > o.budget && kind !== 'sig') uri = await shrinkImage(file, { maxW: o.w, maxH: o.h, type: 'image/jpeg', quality: 0.86 });
  if (uri.length > o.budget) uri = await shrinkImage(file, { maxW: Math.round(o.w * 0.6), maxH: Math.round(o.h * 0.6), type: kind === 'sig' ? 'image/png' : 'image/jpeg', quality: 0.8 });
  if (uri.length > o.budget * 1.6) throw new Error(`Gambar ${o.label} masih terlalu besar setelah diperkecil. Pakai gambar yang lebih sederhana.`);
  return uri;
}
function cfSetImage(k, uri) {
  if (k.startsWith('sig:')) { const s = CF.sg[+k.slice(4)]; if (!s) return; s.signature = uri; }
  else { CF.d[k] = uri; if (k === 'headerImage') CF.d.headerMode = uri ? 'image' : 'text'; if (k === 'footerImage') CF.d.footerMode = uri ? 'image' : 'text'; }
  cfMarkDirty(); cfRefreshForm(); cfSchedule();
}

function cfLyValidate() {
  const out = [], L = CF.d.layout, S = CF.d.sections || [];
  Object.keys(CF_LY_NUM).forEach(k => {
    if (/^header\./.test(k) && L.header.kind !== 'ezd') return;
    if (/^cover\.(title|sig|notes)\.|^cover\.topMm$/.test(k) && !L.cover.on) return;
    if (/^cover\.sig\./.test(k) && !L.cover.sig.on) return;
    if (/^cover\.notes\./.test(k) && !(L.cover.sig.on && L.cover.notes.on)) return;
    const [label, lo, hi] = CF_LY_NUM[k], raw0 = String(getPath(L, k) == null ? '' : getPath(L, k)).trim(), n = Number(raw0.replace(',', '.'));
    if (raw0 === '' || !isFinite(n) || n < lo || n > hi) out.push(['error', `${label.replace(/ \((mm|pt)\)$/, '')} harus ${lo}–${hi}${/\((mm|pt)\)$/.test(label) ? ' ' + /\((mm|pt)\)$/.exec(label)[1] : ''}.`, 'lay']);
  });
  if (L.header.kind === 'ezd') (L.header.cols || []).forEach((v, i) => { const n = Number(String(v).replace(',', '.')); if (!isFinite(n) || n < 5 || n > 80) out.push(['error', `Lebar kolom header "${CF_LY_COLS[i] || i + 1}" harus 5–80.`, 'lay']); });
  if (!/^#[0-9a-fA-F]{6}$/.test(String(L.footer.color || ''))) out.push(['error', 'Warna teks kaki halaman harus berformat #RRGGBB.', 'lay']);
  if (!String(L.font.family || '').trim()) out.push(['error', 'Jenis huruf dokumen belum dipilih.', 'lay']);
  if (L.cover.on && L.cover.sig.on && L.cover.sig.showDate && !String(L.cover.sig.dateLabel || '').trim()) out.push(['warn', 'Tulisan sebelum tanggal pada tabel tanda tangan kosong.', 'lay']);
  S.forEach((s, i) => {
    if (!String(s.title || '').trim()) out.push(['error', `Judul bagian nomor ${i + 1} belum diisi.`, 'str']);
    if (!SEC_DEFS[s.id] && s.kind === 'table' && !(s.cols || []).filter(x => String(x).trim()).length) out.push(['error', `Kolom tabel pada bagian "${s.title || i + 1}" belum diisi.`, 'str']);
  });
  if (S.length && !S.some(s => s.show !== false)) out.push(['warn', 'Semua bagian disembunyikan — dokumen SOP akan kosong.', 'str']);
  const t = S.filter(s => s.show !== false).map(s => String(s.title || '').trim().toLowerCase()).filter(Boolean);
  if (new Set(t).size !== t.length) out.push(['warn', 'Ada dua bagian dengan judul yang sama.', 'str']);
  return out;
}

function stgNumLint(n) {

  if (unknown.length) out.push(['error', `Penanda tidak dikenal: ${unknown.join(' ')}. Gunakan salah satu penanda di daftar.`]);
  if (!/\{(NNN|N)\}/.test(f)) out.push(['error', 'Format harus memuat {NNN} atau {N} supaya setiap surat mendapat nomor urut yang berbeda.']);
  if (n.scope === 'type' && !/\{KODE\}/.test(f)) out.push(['warn', 'Urutan dipisah per jenis surat tetapi format tidak memuat {KODE}: dua jenis surat bisa mendapat nomor yang tampak sama. Sistem akan melewati nomor yang sudah dipakai.']);

const STG_OBJ_KEYS = ['hist', 'counters', 'docConfig', 'settings'];
const stgIsObj = v => v && typeof v === 'object' && !Array.isArray(v);
function stgValidateBackup(j) {
  const d = j.data;
  if (+j.schema > 8) return `Backup dibuat oleh versi sistem yang lebih baru (skema ${j.schema}). Perbarui aplikasi dulu.`;
  const have = EXPORT_KEYS.filter(k => d[k] !== undefined);
  if (!have.length) return 'Berkas backup kosong.';
  const badList = STG_LIST_KEYS.find(k => d[k] !== undefined && !Array.isArray(d[k])); if (badList) return `Bagian "${badList}" di backup rusak (seharusnya daftar).`;
  const badObj = STG_OBJ_KEYS.find(k => d[k] !== undefined && !stgIsObj(d[k])); if (badObj) return `Bagian "${badObj}" di backup rusak (seharusnya objek).`;
  if (d.users !== undefined && !Array.isArray(d.users)) return 'Bagian "users" di backup rusak.';
  if (arr(d.sops).some(s => !stgIsObj(s) || !str(s.code).trim())) return 'Ada SOP di backup tanpa kode.';
  if (arr(d.letters).some(l => !stgIsObj(l) || !str(l.no).trim())) return 'Ada surat di backup tanpa nomor.';
  if (arr(d.kpiData).some(x => !stgIsObj(x) || !x.kpi || !x.period)) return 'Ada data KPI di backup yang tidak lengkap.';
  if (arr(d.users).some(u => !stgIsObj(u) || !u.username || !u.hash || !u.salt || !ROLES[u.role])) return 'Data akun di backup tidak lengkap.';
  return '';
}

/* ---------- impor SOP dari ekspor v7.1 ---------- */
async function stgImportV7(list, file) {
  const valid = list.filter(x => stgIsObj(x) && str(x.code).trim() && str(x.title).trim()), bad = list.length - valid.length;
  const have = new Set(DB.sops.map(s => s.code)), seen = new Set(), fresh = [], dup = [];
  valid.forEach(x => { const c = str(x.code).trim(); if (have.has(c) || seen.has(c)) dup.push(c); else { seen.add(c); fresh.push(x); } });
  if (!fresh.length) return toast(`Tidak ada SOP baru: ${dup.length} kode sudah ada${bad ? `, ${bad} entri tidak valid` : ''}.`, 'danger', 6000);
  const ok = await confirmBox({ title: 'Impor SOP dari v7.1', text: `${fresh.length} SOP baru akan ditambahkan (berstatus sesuai berkas, revisi dimulai 00, tanggal terbit hari ini).${dup.length ? ` ${dup.length} SOP dengan kode yang sudah ada dilewati.` : ''}${bad ? ` ${bad} entri tidak valid diabaikan.` : ''}`, ok: `Impor ${fresh.length} SOP` });
  if (!ok) return;
  const snap = { sops: DB.sops.slice(), hist: Object.assign({}, DB.hist) }; let n = 0, fail = 0;
  fresh.forEach(o => {
    try { const s = sopFromV7(o); s.createdBy = s.updatedBy = Auth.user.name; DB.sops.push(s); DB.hist[s.code] = histInit(s, 'Impor dari ekspor v7.1' + (s.legacyVer ? ` (versi lama ${s.legacyVer})` : '')); n++; } catch (e) { console.error(e); fail++; }
  });
  if (!dbSave('sops', 'hist')) { DB.sops = snap.sops; DB.hist = snap.hist; return toast('Penyimpanan penuh — impor dibatalkan.', 'danger'); }
  logAct('Impor SOP v7.1', file.name, `${n} ditambahkan, ${dup.length} dilewati${fail ? `, ${fail} gagal` : ''}`);
  toast(`${n} SOP diimpor${fail ? `, ${fail} gagal` : ''}.`, fail ? 'info' : 'ok', 5000); App.rerender();
}

/* pemeriksaan integritas data (turunan, tidak disimpan). fix = kunci perbaikan otomatis */
function healthChecks() {
  const out = [], add = (level, title, text, fix) => out.push({ level, title, text, fix });
  const sopCodes = new Set(DB.sops.map(s => s.code));
  const dupSop = DB.sops.filter((s, i) => DB.sops.findIndex(x => x.code === s.code) !== i).map(s => s.code);
  if (dupSop.length) add('danger', 'Kode SOP ganda', `${uniq(dupSop).join(', ')} muncul lebih dari sekali. Ubah salah satu kodenya lewat editor SOP.`);
  const orphHist = Object.keys(DB.hist).filter(c => !sopCodes.has(c));
  if (orphHist.length) add('warn', 'Riwayat revisi tanpa SOP', `${orphHist.length} riwayat tidak punya SOP induk (${orphHist.slice(0, 3).join(', ')}${orphHist.length > 3 ? '…' : ''}).`, 'orphHist');
  const kIds = new Set(DB.kpiDefs.map(k => k.id));
  const orphKpi = DB.kpiData.filter(d => !kIds.has(d.kpi));
  if (orphKpi.length) add('warn', 'Data KPI tanpa indikator', `${orphKpi.length} titik data merujuk indikator yang sudah dihapus.`, 'orphKpi');
  const seen = new Set(), dupKpi = DB.kpiData.filter(d => { const k = d.kpi + '|' + d.period; if (seen.has(k)) return true; seen.add(k); return false; });
  if (dupKpi.length) add('warn', 'Data KPI ganda', `${dupKpi.length} titik data punya indikator dan periode yang sama dengan data lain (yang terakhir dipakai).`, 'dupKpi');
  const badK = DB.sops.filter(s => arr(s.kpi).some(id => !kIds.has(id)));
  if (badK.length) add('info', 'SOP merujuk KPI yang tidak ada', `${badK.map(s => s.code).slice(0, 4).join(', ')}${badK.length > 4 ? '…' : ''} — buka editor SOP dan pilih ulang KPI.`);
  const fCodes = new Set(DB.forms.map(f => f.code)), badF = DB.sops.filter(s => arr(s.forms).some(c => !fCodes.has(c)));
  if (badF.length) add('info', 'SOP merujuk formulir yang tidak ada', `${badF.map(s => s.code).slice(0, 4).join(', ')}${badF.length > 4 ? '…' : ''} — periksa tab Formulir di editor SOP.`);
  const nos = {}, dupNo = []; DB.letters.forEach(l => { const k = String(l.no).toLowerCase(); if (nos[k]) dupNo.push(l.no); nos[k] = 1; });
  if (dupNo.length) add('danger', 'Nomor surat ganda', `${uniq(dupNo).slice(0, 4).join(', ')}${uniq(dupNo).length > 4 ? '…' : ''} terbit lebih dari sekali. Periksa di Register surat.`);
  const lowC = Object.keys(DB.counters).filter(k => DB.letters.some(l => l.key === k && l.seq > (DB.counters[k] || 0)));
  if (lowC.length) add('warn', 'Penghitung nomor tertinggal', `${lowC.length} penghitung lebih kecil dari nomor surat yang sudah terbit.`, 'counters');
  const aid = new Set(), dupA = DB.audits.filter(a => { if (aid.has(a.id)) return true; aid.add(a.id); return false; });
  if (dupA.length) add('danger', 'ID temuan audit ganda', `${dupA.map(a => a.id).join(', ')}.`);
  const admins = DB.users.filter(u => u.role === 'admin' && !u.disabled);
  if (!admins.length) add('danger', 'Tidak ada administrator aktif', 'Aktifkan atau buat akun administrator.');
  const dflt = DB.users.filter(u => !u.disabled && usrIsDefaultPw(u));
  if (dflt.length) add('warn', 'Akun masih memakai kata sandi bawaan', `${dflt.map(u => u.username).join(', ')} — minta pemiliknya menggantinya atau nonaktifkan akunnya.`);
  const used = Store.total() / STORAGE_QUOTA_CHARS;
  if (used > 0.8) add('warn', 'Penyimpanan browser hampir penuh', `Terpakai ${Math.round(used * 100)}%. Unduh backup dan kecilkan gambar kop/tanda tangan.`);
  if (!DB.signers.some(s => s.showInSOP)) add('warn', 'Belum ada penandatangan SOP', 'Blok tanda tangan SOP akan kosong. Atur di Kop & tata letak.');
  return out;
}
function healthFix(key) {
  let n = 0;
  if (key === 'orphHist') { const ok = new Set(DB.sops.map(s => s.code)); Object.keys(DB.hist).forEach(c => { if (!ok.has(c)) { delete DB.hist[c]; n++; } }); if (n && !dbSave('hist')) healthFix.ok = false; }
  else if (key === 'orphKpi') { const ids = new Set(DB.kpiDefs.map(k => k.id)), before = DB.kpiData.length; DB.kpiData = DB.kpiData.filter(d => ids.has(d.kpi)); n = before - DB.kpiData.length; if (n && !dbSave('kpiData')) healthFix.ok = false; }
  else if (key === 'dupKpi') { const m = new Map(); DB.kpiData.forEach(d => m.set(d.kpi + '|' + d.period, d)); const before = DB.kpiData.length; DB.kpiData = DB.kpiData.filter(d => m.get(d.kpi + '|' + d.period) === d); n = before - DB.kpiData.length; if (n && !dbSave('kpiData')) healthFix.ok = false; }
  else if (key === 'counters') { Object.keys(DB.counters).forEach(k => { const mx = DB.letters.reduce((a, l) => l.key === k && l.seq > a ? l.seq : a, 0); if (mx > (DB.counters[k] || 0)) { DB.counters[k] = mx; n++; } }); if (n && !dbSave('counters')) healthFix.ok = false; }
  return n;
}
ACT['about.fix'] = async () => {
  if (!can('config.manage')) return;
  const fixes = uniq(healthChecks().map(x => x.fix).filter(Boolean)); if (!fixes.length) return;
  const before = clone({ hist: DB.hist, kpiData: DB.kpiData, counters: DB.counters });
  let total = 0; healthFix.ok = true; fixes.forEach(k => { total += healthFix(k); });
  if (!healthFix.ok) { DB.hist = before.hist; DB.kpiData = before.kpiData; DB.counters = before.counters; dbSave('hist', 'kpiData', 'counters'); return toast('Gagal menyimpan perbaikan: penyimpanan penuh.', 'danger'); }
  logAct('Perbaiki data otomatis', '', `${total} perbaikan (${fixes.join(', ')})`); toast(`${total} perbaikan diterapkan.`, 'ok'); App.rerender();
};

async function boot() {
  dbReset(); applyTheme();
  window.addEventListener('unhandledrejection', e => reportErr(e.reason));
  window.addEventListener('error', e => { if (e.error) console.error(e.error); });
  ['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => Auth.touch(), { passive: true, capture: true }));
  window.addEventListener('beforeunload', e => { if (Cloud.pendingCount()) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('online', () => { if (Cloud.started) { Cloud.retryN = 0; Cloud.drain().catch(() => { }); } });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Cloud.started && Date.now() - Cloud.lastPull > 120000) Cloud.resync(); });
  setInterval(async () => { if (Auth.idleExpired()) { App.dirty = null; await Auth.logout(false); closeAllModals(); showLogin('Sesi berakhir karena tidak ada aktivitas.'); } }, 30000);
  if (!Cloud.init()) {
    byId('boot').hidden = true; const el = byId('login'); el.hidden = false;
    el.innerHTML = '<section class="login-form" style="grid-column:1/-1"><div class="login-card stack"><h2>Koneksi server belum dikonfigurasi</h2><p class="muted">Buka berkas HTML ini dan isi <b>url</b> serta <b>anonKey</b> pada blok <code>window.EZP_CONFIG</code> di bagian atas (Supabase › Project Settings › API). Pastikan pustaka Supabase termuat (perlu internet).</p></div></section>';
    return;
  }
  // P0: jangan blokir halaman login dengan pemulihan sesi SDK yang bisa macet.
  // Pengguna login kembali sekali setelah upgrade penyimpanan sesi.
  showLogin();
}
const bootWatchdog = setTimeout(() => {
  const el = document.getElementById('boot');
  if (el && !el.hidden) {
    console.warn('Boot watchdog: kembali ke login tanpa reload.');
    showLogin('Pemulihan awal terlalu lama. Silakan masuk ulang.');
  }
}, 8000);
boot().then(() => clearTimeout(bootWatchdog)).catch(e => {
  clearTimeout(bootWatchdog);
  console.error('Boot gagal:', e);
  const bootEl = document.getElementById('boot');
  if (bootEl) {
    bootEl.innerHTML = '<div style="max-width:560px;margin:auto;padding:24px;text-align:left;font:14px/1.6 system-ui"><h2>Aplikasi gagal dimuat</h2><p>Periksa koneksi internet dan buka aplikasi melalui HTTPS (GitHub Pages), bukan langsung dari file Downloads.</p><p id="bootError" style="overflow-wrap:anywhere;color:#a11"></p><button onclick="location.reload()">Coba lagi</button></div>';
    document.getElementById('bootError').textContent = String(e && (e.message || e) || 'Kesalahan tidak diketahui');
  }
});
